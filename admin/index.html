<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RB 管理者パネル（引っこしました）</title>
<style>
  body{margin:0; font-family:system-ui, sans-serif; background:#0b1622; color:#e8f3ff; display:grid; place-items:center; min-height:100vh; text-align:center; padding:16px;}
  a{color:#7cc4ff; font-weight:700;}
</style>
</head>
<body>
<div>
  <p>管理者パネルは引っこしました。</p>
  <p><a id="go" href="https://monsterroberxi11-bot.github.io/ap-admin/">新しい管理者パネルを開く</a></p>
  <p style="font-size:13px;opacity:.8">ホーム画面に入れている人は、新しいほうを入れ直してください。</p>
</div>
<script>
  // 管理者パネルは /routine-bank/ の外（ap-admin）へ移した。#dev などの続きもそのまま渡す
  var to = 'https://monsterroberxi11-bot.github.io/ap-admin/' + location.hash;
  document.getElementById('go').href = to;
  // 前の管理者パネルの Service Worker を外す（古い画面がキャッシュから出続けないように）
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      regs.forEach(function (r) { if (new URL(r.scope).pathname === location.pathname.replace(/index\.html$/, '')) r.unregister(); });
    }).finally(function () { location.replace(to); });
  } else location.replace(to);
</script>
</body>
</html>
