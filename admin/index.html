<!-- ============================================================
     Routine Bank  ―  画面の骨組み
     include('css') / include('js') のところに css.html / js.html の中身が入る
     ============================================================ -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>RB 管理者パネル</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12a08c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="RB 管理者パネル">
  <style>
/* ============================================================
   Routine Bank  ―  見た目（スマホ基準。広い画面だけPC用に変える）
   ============================================================ */

:root{
  --bg:#f3f6f6;
  --card:#ffffff;
  --line:#dfe6e6;
  --text:#1b2424;
  --muted:#667373;
  --primary:#12a08c;      /* 時間＝ミントグリーン */
  --primary-dark:#0c7d6d;
  --primary-soft:#e3f5f2;
  --ok:#1f9d55;
  --warn:#d98a00;
  --danger:#d64545;
  --plus:#1f9d55;
  --minus:#d0482c;
  --radius:12px;
  --tap:44px;
}

*{box-sizing:border-box;}
html,body{margin:0; padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  background:var(--bg); color:var(--text);
  font-size:15px; line-height:1.6; -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}
.hidden{display:none !important;}
.muted{color:var(--muted); font-size:13px;}
.error{color:var(--danger); font-size:13px; min-height:1.2em; margin:4px 0;}
h1{font-size:20px; margin:0 0 8px;}
h2{font-size:15px; margin:0 0 10px; font-weight:700;}
.plus{color:var(--plus);}
.minus{color:var(--minus);}
.num{font-variant-numeric:tabular-nums;}

/* ── 入口の画面 ───────────────── */
.gate{
  position:fixed; inset:0; background:var(--bg); z-index:50;
  display:flex; align-items:center; justify-content:center; padding:20px; overflow-y:auto;
}
.gate-box{
  background:var(--card); border-radius:var(--radius); padding:28px 22px;
  width:100%; max-width:380px; text-align:center; box-shadow:0 2px 12px rgba(0,0,0,.06);
}
.gate-box .form{text-align:left; margin-top:16px;}
.logo-clock{width:120px; height:120px; margin:0 auto 10px;}
.logo-clock svg{width:100%; height:100%; display:block; filter:drop-shadow(0 4px 10px rgba(12,125,109,.25));}
.lg-face{fill:#fff; stroke:var(--primary-dark); stroke-width:6;}
.lg-sector{fill:var(--primary); opacity:.85;}
.lg-tick{stroke:var(--text); stroke-width:4; stroke-linecap:round;}
.lg-hour{stroke:var(--text); stroke-width:9; stroke-linecap:round;}
.lg-min{stroke:var(--text); stroke-width:6; stroke-linecap:round;}
.lg-sec{stroke:#e8590c; stroke-width:2.5; stroke-linecap:round;}
.lg-pin{fill:#e8590c;}
.auth-switch{margin-top:14px;}
.auth-switch a{color:var(--primary-dark); font-weight:700; text-decoration:none;}
.who-list{display:flex; flex-direction:column; gap:8px; margin-top:16px;}
.who-btn{
  border:1px solid var(--line); background:#fff; border-radius:10px;
  padding:14px; font-size:16px; font-weight:700; cursor:pointer; min-height:var(--tap);
}
.who-btn:hover{border-color:var(--primary);}
.spinner{
  width:28px; height:28px; margin:0 auto 12px;
  border:3px solid var(--line); border-top-color:var(--primary);
  border-radius:50%; animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── 上のバー・タブ ───────────────── */
.topbar{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top));
  background:var(--card); border-bottom:1px solid var(--line);
}
.brand{font-weight:800; color:var(--primary-dark);}
.top-right{display:flex; align-items:center; gap:8px;}
.chat-btn{
  position:relative; display:flex; align-items:center; gap:4px;
  border:2px solid var(--primary); background:#fff; color:var(--primary-dark); border-radius:999px;
  height:34px; padding:0 12px 0 10px; font-size:16px; font-weight:800; cursor:pointer; line-height:1;
}
.chat-btn:hover{background:var(--primary); color:#fff;}
.chat-label{font-size:13px;}
.chat-btn .dot{top:-5px; left:auto; right:-6px;}
.me-chip{
  border:1px solid var(--line); background:#fff; border-radius:999px;
  padding:6px 12px; font-weight:700; cursor:pointer; font-size:13px;
}
.tabs{display:none;}
.bottomnav{
  position:fixed; left:0; right:0; bottom:0; z-index:20;
  display:flex; background:var(--card); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.bottomnav button{
  flex:1; border:0; background:none; padding:8px 2px 6px; position:relative;
  font-size:10.5px; color:var(--muted); cursor:pointer; min-height:var(--tap);
  display:flex; flex-direction:column; align-items:center; gap:2px;
}
.bottomnav button .ico{font-size:19px; line-height:1;}
.bottomnav button.active{color:var(--primary-dark); font-weight:700;}
.dot{
  position:absolute; top:4px; left:calc(50% + 8px); min-width:16px; height:16px; padding:0 4px;
  border-radius:999px; background:var(--danger); color:#fff; font-size:10px; line-height:16px; font-weight:700;
}

main{padding:12px 12px 90px; max-width:900px; margin:0 auto;}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px; margin-bottom:12px;
}
.card-head{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
.card-head h2{margin:0;}

/* ── 貯金の表示 ───────────────── */
.bank-mini{
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  padding:14px 16px; border-radius:var(--radius); margin-bottom:12px;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff;
}
.bank-mini .label{font-size:12.5px; opacity:.9; font-weight:700;}
.bank-mini .val{font-size:28px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.2;}
.bank-mini .side{text-align:right; font-size:12.5px; line-height:1.7;}
.bank-mini .side b{font-variant-numeric:tabular-nums;}
.stat-row{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px;}
.stat-row.two{grid-template-columns:repeat(2,1fr);}
/* 連続記録 */
.streak-card{padding:12px 16px;}
.streak-main{display:flex; align-items:center; gap:12px;}
.streak-main .fire{font-size:34px; line-height:1;}
.streak-main .fire.off{filter:grayscale(1); opacity:.4;}
.streak-num{font-size:14px; font-weight:700;}
.streak-num b{font-size:26px; font-variant-numeric:tabular-nums; color:var(--warn);}
.badges{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
.streak-badge{font-size:12.5px; font-weight:700; padding:3px 8px; border-radius:999px; background:var(--line); color:var(--muted); filter:grayscale(1); opacity:.6;}
.streak-badge.got{background:#fff3d6; color:#9a6200; filter:none; opacity:1;}
.done-streak{font-size:20px; margin:10px 0 4px; color:#ffd36b;}
.done-streak .got-badge{font-size:16px; margin-top:4px;}
.streak-next{margin-top:6px;}
.bonus-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px; margin:8px 0 12px;}
.bonus-grid label{display:flex; align-items:center; justify-content:space-between; gap:6px; font-size:13.5px; font-weight:700;}
.bonus-grid label span{display:flex; align-items:center; gap:4px; font-weight:400;}
.bonus-grid input{width:64px;}
.bank-mini.ginko{background:linear-gradient(135deg, #2f5d8a, #1d3f63);}

/* 銀行タブ（ATM）*/
.atm{max-width:480px; margin:0 auto;}
.atm-head{background:#1d3f63; color:#fff; font-weight:800; text-align:center; padding:10px; border-radius:var(--radius) var(--radius) 0 0; letter-spacing:.05em;}
.atm-screen{background:#eaf2fb; border:3px solid #1d3f63; border-top:0; border-radius:0 0 var(--radius) var(--radius); padding:20px 16px; text-align:center; margin-bottom:14px;}
.atm-msg{margin:0; font-size:16px; font-weight:700; color:#1d3f63; line-height:1.7;}
.atm-note{margin:8px 0 0; font-size:12.5px; color:var(--muted);}
.atm-amount{font-size:44px; font-weight:800; color:#1d3f63; font-variant-numeric:tabular-nums; margin:10px 0 4px; letter-spacing:.02em;}
.atm-amount small{font-size:20px; margin-left:4px;}
.atm-menu{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;}
.atm-btn{border:0; border-radius:14px; background:linear-gradient(135deg, #2f5d8a, #1d3f63); color:#fff; font:inherit; font-size:18px; font-weight:800;
  padding:22px 8px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px; box-shadow:0 3px 0 #10273f;}
.atm-btn:active{transform:translateY(2px); box-shadow:0 1px 0 #10273f;}
.atm-btn .ico{font-size:30px;}
.atm-btn.wide{grid-column:1 / -1; flex-direction:row; justify-content:center; padding:16px 8px;}
.atm-btn.wide .ico{font-size:24px;}
.atm-keys{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:10px;}
.atm-key{border:1px solid #c4d3e3; background:#fff; border-radius:12px; font:inherit; font-size:24px; font-weight:800; padding:12px 0; cursor:pointer; color:#1d3f63; box-shadow:0 2px 0 #c4d3e3;}
.atm-key.cancel{font-size:16px; background:#fdecec; color:var(--danger); border-color:#f1c4c4; box-shadow:0 2px 0 #f1c4c4;}
.atm-key.fix{font-size:16px; background:#fff6dc; color:#9a6b00; border-color:#ecd9a3; box-shadow:0 2px 0 #ecd9a3;}
.atm-key.unit{font-size:20px; background:#eef3f9;}
.atm-key.ok{background:#1d3f63; color:#fff; border-color:#1d3f63; box-shadow:0 2px 0 #10273f;}
.atm-key:disabled{opacity:.5;}
.atm-key:active{transform:translateY(2px); box-shadow:none;}
.atm-actions{margin-bottom:10px;}
.atm-actions .btn{flex:1; min-height:50px; font-size:16px;}
.atm-back{width:100%; margin-top:4px;}
.atm-receipt{background:#fff; border:1px dashed #9fb3c8; border-radius:8px; margin:14px auto 0; max-width:280px; padding:10px 14px; text-align:left; font-size:14px;}
.atm-receipt .t{text-align:center; font-weight:800; margin-bottom:6px; color:#1d3f63;}
.atm-receipt .row{display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px dotted #dbe4ee;}
.atm-receipt .row.sub{border:0; color:var(--muted); font-size:12px; justify-content:flex-end;}
.atm-msg.err{color:var(--danger);}

/* キャッシュカード */
.ccard{position:relative; width:280px; max-width:100%; aspect-ratio:1.586; margin:14px auto; border-radius:14px; padding:14px 16px; text-align:left; color:#fff;
  background:linear-gradient(135deg, #3a7bd5 0%, #1d3f63 60%, #12a08c 140%); box-shadow:0 8px 18px rgba(16,39,63,.35); overflow:hidden;}
.ccard::after{content:''; position:absolute; right:-40px; top:-40px; width:160px; height:160px; border-radius:50%; background:rgba(255,255,255,.08);}
.cc-top{display:flex; justify-content:space-between; align-items:baseline;}
.cc-logo{font-weight:800; font-size:15px;}
.cc-type{font-size:10px; letter-spacing:.15em; opacity:.85;}
.cc-chip{width:38px; height:28px; border-radius:6px; margin:16px 0 10px; background:linear-gradient(135deg, #f3d77a, #c9a23a); box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);}
.cc-no{font-family:ui-monospace, Menlo, Consolas, monospace; font-size:15px; letter-spacing:.06em;}
.cc-name{margin-top:8px; font-weight:700; font-size:15px;}
.ccard.small{width:200px; padding:10px 12px; margin:0 auto 12px;}
.ccard.small .cc-chip{width:28px; height:20px; margin:8px 0 6px;}
.ccard.small .cc-no{font-size:11px;} .ccard.small .cc-name{font-size:12px; margin-top:4px;} .ccard.small .cc-logo{font-size:12px;}
.cc-slot{position:relative; height:200px; overflow:hidden;}
.cc-slot::before{content:''; position:absolute; left:50%; top:4px; width:300px; max-width:96%; transform:translateX(-50%); height:8px; border-radius:4px; background:#10273f; z-index:2;}
.ccard.inserting{animation:ccInsert 1.2s ease-in forwards;}
.cc-slot.eject{cursor:pointer;}
.ccard.ejecting{animation:ccEject 1s ease-out forwards;}
@keyframes ccEject{0%{transform:translateY(-190px)} 100%{transform:translateY(24px)}}
@keyframes ccInsert{0%{transform:translateY(40px) rotate(0)} 30%{transform:translateY(30px)} 100%{transform:translateY(-190px)}}
.atm-pin{display:flex; justify-content:center; gap:12px; margin:12px 0 4px;}
.atm-pin span{width:18px; height:18px; border-radius:50%; border:2px solid #1d3f63; background:#fff;}
.atm-pin span.on{background:#1d3f63;}
.stat{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; text-align:center;}
.stat .k{font-size:11.5px; color:var(--muted); font-weight:700;}
.stat .v{font-size:17px; font-weight:800; font-variant-numeric:tabular-nums;}

/* ── ルーチン一覧 ───────────────── */
.routine-list{display:flex; flex-direction:column; gap:8px;}
.routine{
  display:flex; align-items:center; gap:12px; text-align:left; width:100%;
  border:1px solid var(--line); background:#fff; border-radius:12px; padding:14px; cursor:pointer;
}
.routine:hover{border-color:var(--primary);}
.routine .play{
  flex:0 0 auto; width:44px; height:44px; border-radius:50%; background:var(--primary); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:18px;
}
.routine .name{font-weight:800; font-size:16px;}
.routine .sub{font-size:12.5px; color:var(--muted);}
/* スマホの設定画面によくある、左右にスライドするスイッチ */
.toggle-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:6px 0; margin-bottom:6px; font-weight:700; cursor:pointer;}
.toggle{position:relative; flex:none; width:52px; height:32px;}
.toggle input{position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer; z-index:1;}
.toggle .slider{position:absolute; inset:0; border-radius:999px; background:#cfd8d8; transition:background .2s;}
.toggle .slider::before{content:''; position:absolute; top:3px; left:3px; width:26px; height:26px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .2s;}
.toggle input:checked + .slider{background:#34c759;}
.toggle input:checked + .slider::before{transform:translateX(20px);}
.toggle input:focus-visible + .slider{outline:2px solid var(--primary); outline-offset:2px;}
/* お知らせ */
.notice-item{padding:10px 0; border-bottom:1px solid var(--line);}
.notice-item:last-child{border-bottom:0;}
.notice-item .title{font-weight:800;}
.notice-item p{margin:6px 0; white-space:pre-wrap;}
.notice-item.canceled{opacity:.55;}
.switch{display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:var(--muted); cursor:pointer;}
.switch input{width:18px; height:18px; margin:0;}

/* ── 実行中の画面 ───────────────── */
.run{
  position:fixed; inset:0; z-index:40; background:#0f2a27; color:#fff;
  display:flex; flex-direction:column;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.run-top{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:12px 14px;}
.run-top .btn{background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.2); color:#fff;}
.run-title{font-weight:700; font-size:14px; opacity:.85; text-align:center; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.run-progress{height:5px; background:rgba(255,255,255,.12); margin:0 14px; border-radius:999px; overflow:hidden;}
.run-progress div{height:100%; background:var(--primary); width:0; transition:width .3s;}
.run-body{flex:1; overflow-y:auto; padding:18px 18px 24px; display:flex; flex-direction:column; align-items:center; text-align:center;}
.run-count{font-size:13px; opacity:.7; font-weight:700;}
.run-step{font-size:30px; font-weight:800; line-height:1.3; margin:6px 0 2px; word-break:break-word;}
.run-target{font-size:14px; opacity:.75;}
.run-clock{width:min(76vw,46vh,320px); aspect-ratio:1; margin:14px 0 6px; transition:opacity .2s;}
.run-clock svg{width:100%; height:100%; display:block; overflow:visible;}
.run-clock.paused{opacity:.45;}
.ck-face{fill:rgba(255,255,255,.05); stroke:rgba(255,255,255,.18); stroke-width:2;}
.ck-tick{stroke:rgba(255,255,255,.28); stroke-width:1.2; stroke-linecap:round;}
.ck-tick.major{stroke:rgba(255,255,255,.7); stroke-width:2.6;}
.ck-sector{fill:var(--primary);}
.ck-sector.over{fill:#ff6b57;}
.ck-edge{stroke:#fff; stroke-width:3; stroke-linecap:round;}
.ck-hole{fill:#0f2a27;}
.ck-sec{stroke:#ffd166; stroke-width:2; stroke-linecap:round;}
.ck-pin{fill:#ffd166;}
.ck-text{fill:#fff; font-size:27px; font-weight:800; text-anchor:middle; font-variant-numeric:tabular-nums;}
.ck-text.long{font-size:20px;}
.ck-text.over{fill:#ff8a73;}
.ck-sub{fill:rgba(255,255,255,.6); font-size:10px; font-weight:700; text-anchor:middle; letter-spacing:1px;}
.run-saved{font-size:14px; font-weight:700; min-height:1.6em;}
.run-next{
  width:100%; max-width:420px; margin:18px 0 12px; padding:22px 16px; border:0; border-radius:18px;
  background:var(--primary); color:#fff; font-size:22px; font-weight:800; cursor:pointer;
  box-shadow:0 6px 0 var(--primary-dark);
}
.run-next:active{transform:translateY(4px); box-shadow:0 2px 0 var(--primary-dark);}
.run-sub{display:flex; gap:8px; width:100%; max-width:420px;}
.run-sub .btn{flex:1; background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.2); color:#fff;}
.run-sub + .run-sub{margin-top:8px;}
.run-sub .btn{min-width:0; padding-left:6px; padding-right:6px;}
.run-sub + .run-sub .btn{font-size:13.5px;}
.run-upcoming{width:100%; max-width:420px; margin-top:20px; text-align:left; font-size:13px;}
.run-upcoming .row{display:flex; justify-content:space-between; padding:6px 2px; border-bottom:1px solid rgba(255,255,255,.08); opacity:.7;}
.run-upcoming .row.done{opacity:.45;}
.today-tag{display:inline-block; font-size:11px; font-weight:800; padding:1px 6px; border-radius:6px; background:#ffd36b; color:#5a3d00; vertical-align:middle;}
.done-big{font-size:46px; font-weight:800; font-variant-numeric:tabular-nums; margin:8px 0;}
.done-table{width:100%; max-width:420px; text-align:left; margin:12px 0 18px; font-size:14px;}
.done-table .row{display:flex; gap:8px; justify-content:space-between; padding:8px 2px; border-bottom:1px solid rgba(255,255,255,.1);}
.done-table .reason{font-size:12px; opacity:.7;}
.run .plus{color:#7de2c3;}
.run .minus{color:#ff8a73;}

/* ── 理由のチップ ───────────────── */
.chips{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 12px;}
.chip{
  border:1px solid var(--line); background:#fff; border-radius:999px; padding:8px 14px;
  font-size:14px; font-weight:700; cursor:pointer;
}
.chip.active{background:var(--primary); border-color:var(--primary); color:#fff;}

/* ── メンバー切替・期間切替 ───────────────── */
.member-seg{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
.member-seg button{
  flex:1 1 auto; min-width:70px; border:1px solid var(--line); background:#fff;
  border-radius:10px; padding:9px 8px; font-weight:700; cursor:pointer; min-height:var(--tap);
}
.member-seg button.active{background:var(--primary); border-color:var(--primary); color:#fff;}
.member-seg.small button{flex:0 0 auto; min-width:0; padding:6px 14px; min-height:34px; font-size:13px;}

/* ── 交換先タイル ───────────────── */
.tile-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px;}
.tile{
  border:1px solid var(--line); background:#fff; border-radius:12px;
  padding:14px 10px; text-align:center; cursor:pointer; min-height:84px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
}
.tile:hover{border-color:var(--primary);}
.tile:disabled{opacity:.45; cursor:not-allowed;}
.tile .name{font-weight:800; font-size:14.5px;}
.tile .rate{font-size:12.5px; color:var(--muted);}

/* ── リスト ───────────────── */
.list{display:flex; flex-direction:column; gap:6px;}
.list-item{
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  padding:10px 12px; border:1px solid var(--line); border-radius:9px; background:#fff;
}
.list-item.col{flex-direction:column; align-items:stretch;}
.list-item .main{min-width:0; flex:1;}
.list-item .title{font-weight:700; font-size:14px;}
.list-item .sub{font-size:12px; color:var(--muted);}
.list-item .actions{display:flex; gap:6px; flex:0 0 auto; flex-wrap:wrap; justify-content:flex-end;}
.list-head{display:flex; justify-content:space-between; align-items:center; gap:10px; cursor:pointer;}
.steps-mini{margin-top:8px; font-size:12.5px; border-top:1px dashed var(--line); padding-top:6px;}
.steps-mini .row{display:flex; justify-content:space-between; gap:8px; padding:2px 0;}
.steps-mini .reason{color:var(--muted); font-size:11.5px; padding-left:10px;}
.steps-mini .row.canceled > span{text-decoration:line-through; color:var(--muted);}
.steps-mini .row.canceled b{color:var(--muted);}
.list-item.canceled{background:#f6f7f7;}
.list-item.canceled .title{color:var(--muted);}
.list-head .btn.tiny{flex:0 0 auto;}
.step-del{padding:2px 6px; min-height:26px; font-size:12px; margin-left:4px;}
.empty{color:var(--muted); font-size:13px; text-align:center; padding:10px;}
.val{font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap;}
.badge{display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; white-space:nowrap;}
.badge.pending{background:#fdf1da; color:var(--warn);}
.badge.ok{background:#e6f4ea; color:var(--ok);}
.badge.ng{background:#f8e5e5; color:var(--danger);}
.badge.gray{background:#eef0f0; color:var(--muted);}

/* ── 分析 ───────────────── */
.bar-row{display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:13px;}
.bar-row .k{flex:0 0 38%; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.bar-row .track{flex:1; height:10px; border-radius:999px; background:var(--line); overflow:hidden;}
.bar-row .fill{height:100%; background:var(--minus); border-radius:999px;}
.bar-row .n{flex:0 0 auto; font-weight:700; font-variant-numeric:tabular-nums; min-width:3em; text-align:right;}
table.grid{width:100%; border-collapse:collapse; font-size:13px;}
table.grid th,table.grid td{padding:7px 4px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap;}
table.grid th:first-child,table.grid td:first-child{text-align:left; white-space:normal;}
table.grid th{font-size:11.5px; color:var(--muted);}
.compare{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.compare .stat .v{font-size:16px;}

/* ── フォーム・ボタン ───────────────── */
input,select,textarea,button{font-family:inherit; font-size:16px;}
input[type=range],input[type=checkbox]{accent-color:var(--primary);}
input[type=text],input[type=password],input[type=number],input[type=time],select,textarea{
  width:100%; padding:10px 12px; margin-top:4px;
  border:1px solid var(--line); border-radius:9px; background:#fff; color:var(--text); min-height:var(--tap);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary); outline-offset:-1px;}
.form label{display:block; margin-bottom:12px; font-size:13px; color:var(--muted); font-weight:600;}
.form label.inline{display:flex; align-items:center; gap:8px;}
.form label.inline input{width:auto; margin:0;}
.btn{
  border:1px solid var(--line); background:#fff; color:var(--text);
  border-radius:9px; padding:10px 14px; cursor:pointer; min-height:var(--tap); font-weight:700; white-space:nowrap;
}
.btn:hover{filter:brightness(.97);}
.btn.primary{background:var(--primary); border-color:var(--primary); color:#fff;}
.btn.danger{color:var(--danger); border-color:#f0c8c8;}
.btn.block{width:100%;}
.btn.tiny{padding:5px 10px; min-height:32px; font-size:13px;}
.btn:disabled{opacity:.5; cursor:not-allowed;}
.btn-row{display:flex; gap:8px; flex-wrap:wrap;}

/* ── ルーチン編集の動作行 ───────────────── */
.step-edit{display:flex; gap:6px; align-items:center; margin-bottom:8px;}
.step-edit input[type=text]{flex:1; margin:0;}
.step-edit input[type=number]{width:58px; margin:0; padding:10px 6px; text-align:center;}
.step-edit .u{font-size:12px; color:var(--muted);}
.step-edit .btn{padding:6px 8px; min-height:38px;}
.step-edit .on{flex:1; font-weight:700;}
.step-edit.now .on::after{content:'（今）'; font-weight:400; color:var(--muted);}

/* ── 要望チャット ───────────────── */
.chat{
  position:fixed; inset:0; z-index:45; background:var(--bg); display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top);
}
.chat-top{
  display:flex; align-items:center; gap:8px; padding:10px 12px;
  background:var(--card); border-bottom:1px solid var(--line);
}
.chat-title{flex:1; text-align:center; font-weight:800;}
.chat-spacer{width:72px;}
.chat-body{flex:1; overflow-y:auto; padding:14px 12px; display:flex; flex-direction:column; gap:10px;}
.bubble{
  max-width:80%; padding:10px 13px; border-radius:16px; font-size:14.5px; line-height:1.55;
  white-space:pre-wrap; word-break:break-word;
}
.bubble.dev{align-self:flex-start; background:#fff; border:1px solid var(--line); border-top-left-radius:4px;}
.bubble.me{align-self:flex-end; background:var(--primary); color:#fff; border-top-right-radius:4px;}
.bubble .who{font-size:11px; font-weight:800; color:var(--primary-dark); margin-bottom:2px;}
.bubble.unsent{align-self:center; background:none; color:var(--muted); font-size:12.5px; padding:4px 8px;}
.bubble .unsend{border:0; background:none; color:inherit; opacity:.85; text-decoration:underline; font-size:10.5px; padding:0 0 0 4px; cursor:pointer;}
.bubble .copy{margin-top:6px; padding:2px 8px; min-height:0; font-size:11.5px;}
.bubble .at{font-size:10.5px; opacity:.7; margin-top:4px; text-align:right;}
.chat-note{align-self:center; font-size:12px; color:var(--muted); text-align:center;}
.chat-note a{color:var(--primary-dark); font-weight:700;}
.chat-input{
  display:flex; gap:8px; align-items:flex-end; padding:10px 12px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));
  background:var(--card); border-top:1px solid var(--line);
}
.chat-input textarea{flex:1; margin:0; resize:none; min-height:44px; max-height:120px;}

.thread-item{
  display:flex; flex-direction:column; gap:2px; text-align:left; width:100%;
  border:1px solid var(--line); background:#fff; border-radius:12px; padding:12px 14px; cursor:pointer;
}
.thread-item:hover{border-color:var(--primary);}
.thread-item .top{display:flex; justify-content:space-between; gap:8px; align-items:center;}
.thread-item .name{font-weight:800; font-size:14.5px;}
.thread-item .preview{font-size:13px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

/* ── ダイアログ・トースト ───────────────── */
.modal{
  position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:60;
  display:flex; align-items:flex-end; justify-content:center;
}
.modal-box{
  background:#fff; color:var(--text); border-radius:16px 16px 0 0; padding:18px;
  padding-bottom:calc(18px + env(safe-area-inset-bottom));

}
.modal-actions{display:flex; gap:8px; margin-top:10px;}
.modal-actions .btn{flex:1;}
.toast{
  position:fixed; left:50%; bottom:86px; transform:translateX(-50%);
  background:#23282e; color:#fff; padding:12px 18px; border-radius:10px;
  font-size:14px; z-index:70; max-width:90vw; text-align:center; box-shadow:0 4px 16px rgba(0,0,0,.25);
}
.toast.err{background:var(--danger);}
.toast.ok{background:var(--ok);}

/* ── チュートリアル（はじめて開いた人に、本物の画面を光らせて説明）── */
.tour{position:fixed; inset:0; z-index:58;}
.tour-hole{

}
.tour-hole.none{left:50% !important; top:50% !important; width:0 !important; height:0 !important; box-shadow:0 0 0 9999px rgba(0,0,0,.6);}

.tour-card h3{margin:0 0 6px; font-size:16.5px;}

.tour-foot{display:flex; align-items:center; gap:8px; margin-top:14px;}
.tour-dots{flex:1; display:flex; gap:5px;}
.tour-dots span{width:7px; height:7px; border-radius:50%; background:var(--line);}

/* ============================================================

@media (min-width:760px){
  .bottomnav{display:none;}

<script>
/* ============================================================
   Routine Bank  ―  画面の動き
   ============================================================ */

/* インストール版（PWA）のときは build-pwa.js がここにGASのURLを入れる。
   GASのWebアプリとして開いたときは空のまま → google.script.run を使う */
const API_URL = "https://script.google.com/macros/s/AKfycbwYVPlYAM3Xel3O8NP3bErPGCtzW9Mua5WtuWhOv6VHIaDDmb_oT354htcyXW-SFjgboQ/exec";
/* 管理者パネルだけのアプリ（build-pwa.js --admin → pwa/admin/）では true になる */
const ADMIN_APP = true;

/* Routine Bank Offline（build-pwa.js --home）では、サーバーの処理（Code.gs）をこのページの中で動かす。
   そのとき LOCAL_API が用意される。データはこのスマホの中だけに保存（ログイン・ネット不要） */
const IS_LOCAL = typeof LOCAL_API !== 'undefined';

/** サーバーの関数を呼ぶ（await で使える） */
function gs(fnName){
  const args = Array.prototype.slice.call(arguments, 1);
  if (IS_LOCAL) return gsLocal_(fnName, args);
  if (API_URL) return gsFetch_(fnName, args);
  return new Promise(function(resolve, reject){
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fnName].apply(null, args);
  });
}

/* Home版：スマホの中の Code.gs を呼ぶ。成功したら保存、失敗したら途中の書き込みを取り消す。
   JSONを通すのは、GASとの受け渡しと同じく「データだけ」をやりとりするため */
function gsLocal_(fnName, args){
  return new Promise(function(resolve, reject){
    setTimeout(function(){
      try{
        if (!Object.prototype.hasOwnProperty.call(LOCAL_API, fnName)) throw new Error('不明な操作です: ' + fnName);
        const result = LOCAL_API[fnName].apply(null, JSON.parse(JSON.stringify(args)));
        LocalStore.flush();
        resolve(result === undefined ? null : JSON.parse(JSON.stringify(result)));
      }catch(err){
        LocalStore.rollback();
        reject(err);
      }
    }, 0);
  });
}

/* PWA版：GASの doPost に fetch で送る。
   Content-Type を text/plain にするのは、ブラウザの事前確認（CORSプリフライト）を起こさないため */
async function gsFetch_(fnName, args, url){
  let res;
  try{
    res = await fetch(url || API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: fnName, args: args })
    });
  }catch(e){
    const err = new Error('インターネットにつながっていません');
    err.network = true;
    throw err;
  }
  let data;
  try{ data = await res.json(); }
  catch(e){ throw new Error('サーバーの応答が読めませんでした（' + res.status + '）'); }
  if (!data.ok) throw new Error(data.error);
  return data.result;
}

/* ── 端末に覚えておくもの（localStorage）──────────
   rt_token  ログイン中のトークン
   rt_me_<家庭名>  この端末で使う人
   rt_show   残り時間を表示するか
   rt_run    実行中のルーチン（アプリを閉じても続きから再開するため）
   rt_outbox 送信待ちの実行結果（圏外のとき用） */
function load_(key, def){
  try{ const v = localStorage.getItem(key); return v == null ? def : JSON.parse(v); }catch(e){ return def; }
}
function save_(key, val){
  try{ if (val == null) localStorage.removeItem(key); else localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}

const S = {
  token: '', familyName: '',
  members: [], routines: [], rewards: [], balances: {}, pendingCount: 0, today: '',
  me: '',               // この端末の人（メンバーID）
  view: 'timer',
  bankMember: '',       // 貯金タブで見ている人
  ginkoMember: '',      // 銀行タブで見ている人
  anMember: '', anDays: 7,
  parentPin: '',        // 親のPIN（確認済みのものをこの画面を開いている間だけ覚える）
  pinFor: ''            // そのPINがどの親のものか
};

const VIEWS = [
  { key:'timer',    label:'タイマー', ico:'⏱' },
  { key:'bank',     label:'貯金',     ico:'💰' },
  { key:'ginko',    label:'銀行',     ico:'🏦' },
  { key:'analysis', label:'分析',     ico:'📊' },
  { key:'settings', label:'設定',     ico:'⚙️' }
];

const REASONS = ['ぼーっとしてた', 'スマホ・テレビ', '話しかけられた', '思ったより大変', '探し物', '眠かった'];


/* ============================================================
   1. 起動・ログイン
   ============================================================ */

window.addEventListener('load', boot);
window.addEventListener('online', function(){ flushOutbox(); });

async function boot(){
  // 開発者の受信箱：URLの最後が #dev のときは、家庭のログインなしでこちらを開く
  if (ADMIN_APP || location.hash === '#dev'){ show('loading', false); openDevInbox(); return; }
  // Home版：ブラウザが勝手にデータを消さないようにお願いしておく（対応している機種だけ）
  if (IS_LOCAL){ try{ if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){} }
  S.token = load_('rt_token', '');
  if (S.token){
    try{
      await loadBootstrap();
      afterLogin();
      return;
    }catch(err){
      if (err.network){
        // 圏外：ログアウトせず、実行中のルーチンがあれば続けられるようにする
        if (load_('rt_run', null)){ show('loading', false); resumeRun(); return; }
        document.querySelector('#loading .gate-box').innerHTML =
          '<p>' + esc(err.message) + '</p><button class="btn primary block" onclick="location.reload()">もう一度読み込む</button>';
        return;
      }
      save_('rt_token', null);
      S.token = '';
    }
  }
  show('loading', false);
  showAuthMode(IS_LOCAL ? 'register' : 'login');
}

function showAuthMode(mode){
  show('authGate', true);
  startLogoClock_();
  show('authLogin', mode === 'login');
  show('authRegister', mode === 'register');
  if (IS_LOCAL){
    // Home版：家庭のパスワードはいらない（このスマホの中だけで使うため）
    show('rg_pwLabel', false);
    show('rg_back', false);
    document.getElementById('rg_intro').textContent =
      'このスマホ1台を家族で使います。登録もインターネットもいりません。PINは親だけが知っている4けたの数字で、交換の承認や設定の変更に使います。';
    document.getElementById('rg_submit').textContent = 'はじめる';
  }
}

async function doLogin(){
  const errEl = document.getElementById('au_error');
  errEl.textContent = '';
  try{
    const res = await gs('loginFamily', { familyName: val('au_family'), password: val('au_password') });
    await onLoggedIn(res);
  }catch(err){ errEl.textContent = errText(err); }
}

async function doRegister(){
  const errEl = document.getElementById('rg_error');
  errEl.textContent = '';
  try{
    const res = await gs('registerFamily', {
      familyName: val('rg_family'), password: IS_LOCAL ? LocalStore.gas.Utilities.getUuid() : val('rg_password'),
      parentName: val('rg_parent'), pin: val('rg_pin')
    });
    await onLoggedIn(res);
  }catch(err){ errEl.textContent = errText(err); }
}

async function onLoggedIn(res){
  S.token = res.token;
  save_('rt_token', res.token);
  show('authGate', false);
  show('loading', true);
  await loadBootstrap();
  afterLogin();
}

async function loadBootstrap(){
  const b = await gs('getBootstrap', S.token);
  S.familyName = b.familyName;
  S.members = b.members;
  S.routines = b.routines;
  S.rewards = b.rewards;
  S.balances = b.balances;
  S.interest = b.interest || { rate: 0, preview: {}, history: [] };
  S.streak = b.streak || { weekendOff: true, badges: [], members: {} };
  S.pendingCount = b.pendingCount;
  S.today = b.today;
}

function afterLogin(){
  show('loading', false);
  S.me = load_(meKey_(), '');
  if (!member_(S.me)){ openWho(); return; }
  // 親として開くときは毎回PINを確認する（子どもが親になりすませないように）
  if (isParent_(S.me)){ openWho(); chooseMe(S.me); return; }
  enterApp();
}

function meKey_(){ return 'rt_me_' + S.familyName; }

function openWho(){
  const list = activeMembers_();
  document.getElementById('whoList').innerHTML = list.map(function(m){
    return '<button class="who-btn" onclick="chooseMe(\'' + m.id + '\')">' + esc(m.name) +
      (m.role === '親' ? ' <span class="muted">（親）</span>' : '') + '</button>';
  }).join('') || '<p class="muted">メンバーがいません</p>';
  show('whoGate', true);
}

async function chooseMe(id){
  if (isParent_(id) && !(await askPin_(id))) return;   // PINをやめたら選ぶ画面のまま
  if (S.pinFor !== id){ S.parentPin = ''; S.pinFor = ''; }  // 別の人に替えたら覚えたPINは忘れる
  S.me = id;
  save_(meKey_(), id);
  S.bankMember = id;
  S.anMember = id;
  show('whoGate', false);
  enterApp();
}

function enterApp(){
  S.bankMember = S.bankMember || S.me;
  S.anMember = S.anMember || S.me;
  ['topbar', 'tabs', 'main', 'bottomnav'].forEach(function(id){ show(id, true); });
  document.getElementById('meChip').textContent = '👤 ' + member_(S.me).name;
  document.getElementById('showRemaining').checked = load_('rt_show', true);
  renderNav();
  switchView(S.view);
  flushOutbox();
  checkChatUnread_();
  pushResync_();
  // お知らせをタップして開いたとき（URLの最後が #view=… / #chat）
  const link = /^#(view=|chat$|notice$)/.test(location.hash) ? location.hash : '';
  if (link) history.replaceState(null, '', location.pathname + location.search);
  if (load_('rt_run', null)) resumeRun();
  else if (link) openLink_(link);
  else if (!load_(tourKey_(), false)) setTimeout(startTour, 400);   // PINの窓が閉じきってから
  else checkNotices_();
}

// アプリを開いたままお知らせをタップしたときは、Service Worker から行き先が届く
if ('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('message', function(e){
    if (!e.data || e.data.type !== 'open') return;
    if (ADMIN_APP || location.hash === '#dev') return devList_();
    if (S.me && !document.getElementById('main').classList.contains('hidden') && !load_('rt_run', null)) openLink_(e.data.hash);
  });
}

async function logout(){
  try{ await gs('logoutFamily', { token: S.token }); }catch(err){}
  save_('rt_token', null);
  location.reload();
}

function renderNav(){
  const html = function(isBottom){
    return VIEWS.map(function(v){
      const n = v.key === 'bank' ? S.pendingCount : (v.key === 'settings' && isParent_(S.me) ? routineRequests_().length : 0);
      const dot = n ? '<span class="dot">' + n + '</span>' : '';
      return '<button class="' + (S.view === v.key ? 'active' : '') + '" onclick="switchView(\'' + v.key + '\')">' +
        (isBottom ? '<span class="ico">' + v.ico + '</span>' : v.ico + ' ') + v.label + dot + '</button>';

function switchView(key){

  renderNav();
  window.scrollTo(0, 0);
  if (key === 'timer') renderTimerView();
  if (key === 'bank') renderBank();
  if (key === 'ginko') atmGo('menu');

  if (key === 'settings') renderSettings();
}

  await loadBootstrap();
  renderNav();
  switchView(S.view);

   3. タイマータブ（ルーチンをえらぶ）
   ============================================================ */

function renderTimerView(){
  const b = bal_(S.me);
  document.getElementById('bankMini').innerHTML =
    '<div><div class="label">' + esc(member_(S.me).name) + 'の時間貯金</div><div class="val">' + fmtDur(b.balanceSec) + '</div></div>' +
    '<div class="side">今週 <b>' + fmtSigned(b.weekSec) + '</b><br>今月 <b>' + fmtSigned(b.monthSec) + '</b>' +
    (b.bankSec ? '<br>🏦 銀行 <b>' + fmtDur(b.bankSec) + '</b>' : '') + '</div>';
  renderStreak_();

  const list = myRoutines_();
  document.getElementById('routineList').innerHTML = list.map(function(r){
    const total = r.steps.reduce(function(s, x){ return s + x.targetSec; }, 0);
    return '<button class="routine" onclick="startRun(\'' + r.id + '\')">' +
      '<span class="play">▶</span><span><div class="name">' + esc(r.name) + '</div>' +
      '<div class="sub">' + r.steps.length + 'こ・目標 ' + fmtDur(total) + '</div></span></button>';
  }).join('') || '<p class="empty">使えるルーチンがありません</p>';
  const waiting = S.routines.filter(function(r){ return r.createdBy === S.me && isRequesting_(r); }).length;
  if (waiting) document.getElementById('routineList').insertAdjacentHTML('beforeend',
    '<p class="muted">⏳ 親の承認待ちのルーチンが ' + waiting + 'こ あります</p>');
  document.getElementById('routineList').insertAdjacentHTML('beforeend',
    '<button class="btn block" onclick="editRoutine(\'\')">＋ ルーチンを作る</button>');
  renderOutbox();
}

function streakOf_(id){ return S.streak.members[id] || { current: 0, best: 0, today: false }; }

/** 連続記録のカード。今日まだなら「今日やると◯日連続」、バッジは最高記録までのぶんが光る */
function renderStreak_(){
  const st = streakOf_(S.me);
  const msg = st.today ? '✅ 今日はもうやったよ'
    : st.current ? '今日やると ' + (st.current + 1) + '日連続！' : 'ルーチンを最後までやると1日目！';
  document.getElementById('streakCard').innerHTML =
    '<div class="streak-main"><span class="fire' + (st.current ? '' : ' off') + '">🔥</span><div>' +
      '<div class="streak-num"><b>' + st.current + '</b>日連続</div>' +
      '<div class="muted">' + msg + (st.best ? '・最高 ' + st.best + '日' : '') + (S.streak.weekendOff ? '・土日はお休み' : '') + '</div></div></div>' +
    '<div class="badges">' + S.streak.badges.map(function(n){
      const bonus = (S.streak.bonus || {})[n];
      return '<span class="streak-badge' + (st.best >= n ? ' got' : '') + '" title="' + n + '日連続' + (bonus ? '・ボーナス' + bonus + '分' : '') + '">🏅' + n + '</span>';
    }).join('') + '</div>' + nextBadgeText_(st);
}

/** 次にとれるバッジ（ボーナスがあれば分数も） */
function nextBadgeText_(st){
  const next = S.streak.badges.filter(function(n){ return n > st.best; })[0];
  if (!next) return '';
  const bonus = (S.streak.bonus || {})[next];
  return '<div class="muted streak-next">次のバッジ：' + next + '日（あと ' + (next - st.current) + '日）' + (bonus ? '　🎁 +' + bonus + '分' : '') + '</div>';
}

function myRoutines_(){
  return S.routines.filter(function(r){
    return r.approved && r.active && r.steps.length && (!r.memberId || r.memberId === S.me);
  });
}

/** 子どもの申請が親の承認待ちか（却下されたものは含まない） */
function isRequesting_(r){ return !!r.request && !r.rejectReason; }
function routineRequests_(){ return S.routines.filter(isRequesting_); }

function setShowRemaining(on){ save_('rt_show', !!on); }


/* ============================================================
   4. ルーチン実行（ここが本体）
   時間は「開始した時刻」から計算するので、画面を閉じても・スリープしてもずれない。
   ============================================================ */

let R = null;          // 実行中のルーチン（rt_run に保存）
let tickTimer = null;
let clockRaf = 0;
let wakeLock = null;

function startRun(routineId){
  const r = S.routines.filter(function(x){ return x.id === routineId; })[0];
  if (!r) return;
  R = {
    runId: uuid_(), memberId: S.me, memberName: member_(S.me).name,
    routineId: r.id, routineName: r.name, date: localDate_(),
    steps: r.steps.map(function(s){ return { id: s.id, name: s.name, targetSec: s.targetSec }; }),
    idx: 0, stepStart: 0, pausedAt: null, pausedMs: 0, alerted: false,
    showRemaining: load_('rt_show', true),
    results: [], askingReason: false
  };
  startStep_();
  openRunScreen_();
}

function resumeRun(){
  R = load_('rt_run', null);
  if (!R) return;
  openRunScreen_();
  if (R.askingReason) askReason_();
}

function openRunScreen_(){
  show('runScreen', true);
  show('runBody', true);
  show('runDone', false);
  document.getElementById('runTitle').textContent = R.routineName + '（' + R.memberName + '）';
  requestWakeLock_();
  buildClock_();
  stopTimers_();
  tickTimer = setInterval(renderRun_, 250);
  clockLoop_();
  renderRun_();
}

function stopTimers_(){
  clearInterval(tickTimer);
  cancelAnimationFrame(clockRaf);
}

function startStep_(){
  R.stepStart = Date.now();
  R.pausedAt = null;
  R.pausedMs = 0;
  R.alerted = false;
  R.refillAt = Date.now();   // 時計の扇形が満タンに戻るアニメーション用
  persistRun_();
  const s = R.steps[R.idx];
  speak((R.idx === 0 ? 'スタート。' : '次は、') + s.name + '。目標' + speakDur_(s.targetSec));
}

function persistRun_(){ save_('rt_run', R); }

function elapsedMs_(){
  return (R.pausedAt || Date.now()) - R.stepStart - R.pausedMs;
}

function renderRun_(){
  if (!R || R.idx >= R.steps.length) return;
  const s = R.steps[R.idx];
  const elapsed = Math.floor(elapsedMs_() / 1000);
  const remain = s.targetSec - elapsed;

  document.getElementById('runCount').textContent = (R.idx + 1) + ' / ' + R.steps.length;
  document.getElementById('runStep').innerHTML = esc(s.name) + (s.today ? ' <span class="today-tag">今日だけ</span>' : '');
  document.getElementById('runTarget').textContent = '目標 ' + fmtDur(s.targetSec);
  document.getElementById('runBar').style.width = (R.idx / R.steps.length * 100) + '%';
  document.getElementById('runEye').textContent = R.showRemaining ? '🙈 かくす' : '👁 見る';
  document.getElementById('runPause').textContent = R.pausedAt ? '▶ 再開' : '⏸ 一時停止';

  const saved = R.results.reduce(function(sum, x){ return sum + (x.targetSec - x.actualSec); }, 0);
  document.getElementById('runSaved').innerHTML = R.results.length
    ? 'ここまでの貯金 <span class="' + (saved < 0 ? 'minus' : 'plus') + '">' + fmtSigned(saved) + '</span>' : '';

  document.getElementById('runUpcoming').innerHTML = R.steps.map(function(x, i){
    if (i === R.idx) return '';
    const res = R.results.filter(function(r){ return r.stepId === x.id && r.idx === i; })[0];
    const right = res ? '<span class="' + (res.targetSec - res.actualSec < 0 ? 'minus' : 'plus') + '">' + fmtSigned(res.targetSec - res.actualSec) + '</span>'
                      : (i < R.idx ? 'とばした' : fmtDur(x.targetSec));
    return '<div class="row' + (i < R.idx ? ' done' : '') + '"><span>' + (i < R.idx ? '✓ ' : '') + esc(x.name) + (x.today ? ' <span class="today-tag">今日だけ</span>' : '') + '</span><span>' + right + '</span></div>';
  }).join('');

  // 時間ぴったりのお知らせ（残り時間を表示しているときだけ）
  if (R.showRemaining && !R.alerted && !R.pausedAt && remain <= 0){
    R.alerted = true;
    persistRun_();
    speak('時間です');
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  }
}

/* ── 動く時計 ─────────────────────────
   文字盤の上の扇形＝残り時間（減っていく）。オーバーしたら赤い扇形が伸びる。
   「かくす」モードでは扇形と数字を出さず、針だけ時間と関係ない速さで回す。 */
const CK_R = 86;   // 扇形の半径

function buildClock_(){
  let ticks = '';
  for (let i = 0; i < 60; i++){
    const major = i % 5 === 0;
    ticks += '<line x1="0" y1="-100" x2="0" y2="' + (major ? -89 : -95) + '" transform="rotate(' + (i * 6) + ')" class="ck-tick' + (major ? ' major' : '') + '"/>';
  }
  document.getElementById('runClock').innerHTML =
    '<svg viewBox="-110 -110 220 220" aria-hidden="true">' +
      '<circle r="104" class="ck-face"/>' + ticks +
      '<path id="ckSector" class="ck-sector"/>' +
      '<line id="ckEdge" x1="0" y1="0" x2="0" y2="-' + CK_R + '" class="ck-edge"/>' +
      '<g id="ckSecHand"><line x1="0" y1="0" x2="0" y2="-97" class="ck-sec"/><circle cy="-97" r="4" class="ck-pin"/></g>' +
      '<circle r="47" class="ck-hole"/>' +
      '<text id="ckText" y="6" class="ck-text"></text>' +
      '<text id="ckSub" y="26" class="ck-sub"></text>' +
    '</svg>';
}

function clockLoop_(){
  drawClock_();
  clockRaf = requestAnimationFrame(clockLoop_);
}

function drawClock_(){
  if (!R || R.idx >= R.steps.length) return;
  const s = R.steps[R.idx];
  const now = R.pausedAt || Date.now();
  const elapsed = elapsedMs_() / 1000;
  const remain = s.targetSec - elapsed;
  const over = remain < 0;
  const shown = R.showRemaining;

  let frac = over ? Math.min(1, -remain / s.targetSec) : remain / s.targetSec;
  const t = (Date.now() - (R.refillAt || 0)) / 700;
  if (!over && t < 1) frac *= 1 - Math.pow(1 - t, 3);   // 満タンに戻るアニメーション

  const sector = document.getElementById('ckSector');
  sector.setAttribute('d', shown ? sectorPath_(frac, CK_R) : '');
  sector.setAttribute('class', 'ck-sector' + (over ? ' over' : ''));
  const edge = document.getElementById('ckEdge');
  edge.style.display = shown ? '' : 'none';
  edge.setAttribute('transform', 'rotate(' + (frac * 360) + ')');

  // 秒針：表示モードは本当の秒、かくすモードは7.3秒で1周（時間の手がかりにならない速さ）
  const secAngle = shown ? (elapsed % 60) * 6 : (now / 7300 * 360) % 360;
  document.getElementById('ckSecHand').setAttribute('transform', 'rotate(' + secAngle + ')');

  const text = document.getElementById('ckText');
  const sub = document.getElementById('ckSub');
  if (shown){
    const sec = over ? Math.floor(-remain) : Math.ceil(remain);
    text.textContent = (over ? '+' : '') + fmtClock(sec);
    sub.textContent = R.pausedAt ? '一時停止中' : (over ? 'オーバー' : 'のこり');
  }else{
    text.textContent = '?';
    sub.textContent = R.pausedAt ? '一時停止中' : 'かくし中';
  }
  text.setAttribute('class', 'ck-text' + (over && shown ? ' over' : '') + (text.textContent.length > 5 ? ' long' : ''));
  document.getElementById('runClock').classList.toggle('paused', !!R.pausedAt);
}

/* ── ログイン画面の時計 ─────────────────
   針は今の時刻。後ろの扇形は「減っては満タンに戻る」をくり返して、アプリの中身を見せる */
let logoRaf = 0;

function startLogoClock_(){
  const box = document.getElementById('logoClock');
  if (!box.firstChild){
    let ticks = '';
    for (let i = 0; i < 12; i++){
      ticks += '<line x1="0" y1="-100" x2="0" y2="-88" transform="rotate(' + (i * 30) + ')" class="lg-tick"/>';
    }
    box.innerHTML = '<svg viewBox="-110 -110 220 220" aria-hidden="true">' +
      '<circle r="106" class="lg-face"/>' +
      '<path id="lgSector" class="lg-sector"/>' + ticks +
      '<line id="lgHour" x1="0" y1="8" x2="0" y2="-48" class="lg-hour"/>' +
      '<line id="lgMin" x1="0" y1="10" x2="0" y2="-74" class="lg-min"/>' +
      '<line id="lgSec" x1="0" y1="16" x2="0" y2="-84" class="lg-sec"/>' +
      '<circle r="6" class="lg-pin"/></svg>';
  }
  cancelAnimationFrame(logoRaf);
  const loop = function(){
    if (document.getElementById('authGate').classList.contains('hidden')) return;  // 画面が消えたら止める
    const d = new Date();
    const sec = d.getSeconds() + d.getMilliseconds() / 1000;
    const min = d.getMinutes() + sec / 60;
    const hour = d.getHours() % 12 + min / 60;
    document.getElementById('lgSec').setAttribute('transform', 'rotate(' + sec * 6 + ')');
    document.getElementById('lgMin').setAttribute('transform', 'rotate(' + min * 6 + ')');
    document.getElementById('lgHour').setAttribute('transform', 'rotate(' + hour * 30 + ')');
    // 6秒かけて減り、0.8秒で満タンに戻る
    const t = (Date.now() % 6800) / 1000;
    const frac = t < 6 ? 1 - t / 6 : Math.pow((t - 6) / 0.8, 0.5);
    document.getElementById('lgSector').setAttribute('d', sectorPath_(frac, 94));
    logoRaf = requestAnimationFrame(loop);
  };
  loop();
}

/** 12時の位置から時計回りに frac（0〜1）ぶんの扇形 */
function sectorPath_(frac, r){
  if (frac <= 0.0005) return '';
  if (frac >= 0.9995) return 'M0,' + (-r) + 'A' + r + ',' + r + ' 0 1 1 0,' + r + 'A' + r + ',' + r + ' 0 1 1 0,' + (-r) + 'Z';
  const a = frac * 2 * Math.PI;
  const x = (r * Math.sin(a)).toFixed(2), y = (-r * Math.cos(a)).toFixed(2);
  return 'M0,0L0,' + (-r) + 'A' + r + ',' + r + ' 0 ' + (frac > 0.5 ? 1 : 0) + ' 1 ' + x + ',' + y + 'Z';
}

/** 「できた！次へ」 */
function nextStep(){
  if (!R || R.askingReason) return;
  const s = R.steps[R.idx];
  const actualSec = Math.max(0, Math.round(elapsedMs_() / 1000));
  R.results.push({ idx: R.idx, stepId: s.id, name: s.name, targetSec: s.targetSec, actualSec: actualSec,
                   reason: '', showRemaining: R.showRemaining });
  if (actualSec > s.targetSec){
    // オーバー：理由を聞く。聞いている間は次の動作の時間を進めない
    R.askingReason = true;
    R.pausedAt = Date.now();   // 理由を書いている間は時計を止める
    persistRun_();
    speak(speakDur_(actualSec - s.targetSec) + 'オーバー。理由を教えてね');
    askReason_();
  }else{
    if (actualSec < s.targetSec) speak(speakDur_(s.targetSec - actualSec) + '貯金');
    goNext_();
  }
}

function askReason_(){
  const last = R.results[R.results.length - 1];
  let picked = '';
  openModal({
    title: '⏰ ' + last.name + ' が ' + fmtDur(last.actualSec - last.targetSec) + ' オーバー',
    body: '<p class="muted">なんでオーバーしたかな？（あとで「分析」で見られるよ）</p>' +
      '<div class="chips" id="reasonChips">' + REASONS.map(function(r){
        return '<button type="button" class="chip" data-r="' + esc(r) + '">' + esc(r) + '</button>';
      }).join('') + '</div>' +
      '<div class="form"><label>くわしく（なくてもOK）<input type="text" id="reasonText" maxlength="100"></label></div>',
    ok: '次へ', cancel: '理由なしで次へ',
    onOpen: function(){
      document.querySelectorAll('#reasonChips .chip').forEach(function(btn){
        btn.onclick = function(){
          picked = picked === btn.dataset.r ? '' : btn.dataset.r;
          document.querySelectorAll('#reasonChips .chip').forEach(function(b){ b.classList.toggle('active', b.dataset.r === picked); });
        };
      });
    },
    onOk: function(){
      const text = val('reasonText');
      last.reason = picked ? (text ? picked + '：' + text : picked) : (text ? 'その他：' + text : '');
      R.askingReason = false;
      goNext_();
    },
    onCancel: function(){
      R.askingReason = false;
      goNext_();
    }
  });
}

function goNext_(){
  R.idx++;
  if (R.idx >= R.steps.length){ finishRun_(); return; }
  startStep_();
  renderRun_();
}

function skipStep(){
  if (!R || R.askingReason) return;
  confirmModal('「' + R.steps[R.idx].name + '」をとばす？', 'とばした動作は記録されません（貯金も増えも減りもしません）', 'とばす', function(){
    goNext_();
  });
}

function togglePause(){
  if (!R) return;
  if (R.pausedAt){
    R.pausedMs += Date.now() - R.pausedAt;
    R.pausedAt = null;
  }else{
    R.pausedAt = Date.now();
  }
  persistRun_();
  renderRun_();
}

function toggleRunShow(){
  R.showRemaining = !R.showRemaining;
  R.alerted = R.alerted || (R.steps[R.idx] && elapsedMs_() / 1000 >= R.steps[R.idx].targetSec);
  persistRun_();
  renderRun_();
}

/** その日だけ思いがけないやることが増えたときに、今日の回だけ動作を足す（ルーチン本体は変えない）。
 *  目標を長くして貯金を増やすズルを防ぐため、子どもが足すときは親のPIN（顔認証も可）が必要。親が使っているときはそのまま */
async function addTodayStep(){
  if (!R || R.askingReason) return;
  if (!isParent_(R.memberId)){
    if (!(await askParentPinOnce_('＋ 今日だけのやること', '今日だけやることを足すには、親のPINが必要です。'))) return;
    await new Promise(function(r){ setTimeout(r, 0); });   // PINの窓が閉じきってから次の窓を開く
  }
  openModal({
    title: '＋ 今日だけのやること',
    body: '<p class="muted">今日の回だけに足します。ルーチン本体は変わりません。</p><div class="form">' +
      '<label>やること<input type="text" id="tdName" maxlength="40" placeholder="例：お米を研ぐ"></label>' +
      '<label>目標時間</label><div class="step-edit">' +
        '<input type="number" id="tdMin" min="0" inputmode="numeric" value="3"><span class="u">分</span>' +
        '<input type="number" id="tdSec" min="0" max="59" inputmode="numeric" value="0"><span class="u">秒</span></div>' +
      '<label>入れる場所<select id="tdWhere"><option value="next">今のやることの次</option><option value="last">いちばん最後</option></select></label></div>',
    ok: '足す',
    onOpen: function(){ setTimeout(function(){ document.getElementById('tdName').focus(); }, 50); },
    onOk: function(){
      const name = val('tdName');
      if (!name) throw new Error('やることを入れてください');
      const sec = (Number(val('tdMin')) || 0) * 60 + (Number(val('tdSec')) || 0);
      if (sec < 1) throw new Error('目標時間を入れてください');
      const at = val('tdWhere') === 'last' ? R.steps.length : R.idx + 1;
      R.steps.splice(at, 0, { id: 'today-' + uuid_().slice(0, 8), name: name, targetSec: Math.round(sec), today: true });
      persistRun_();
      renderRun_();
      speak('今日だけ、' + name + 'を足しました');
    }
  });
}

/** 今日だけ、まだ終わっていない動作の順番を入れかえる（ルーチン本体は変えない）。
 *  今の動作を後ろに回しても、経過時間は新しい「今の動作」に引きつぐ（タイマーを0に戻すズルを防ぐ） */
function reorderRun(){
  if (!R || R.askingReason) return;
  if (R.steps.length - R.idx < 2){ toast('入れかえられる動作がありません', 'err'); return; }
  openModal({
    title: '↕ 今日の順番',
    body: '<p class="muted">今日だけの順番です。ルーチン本体は変わりません。今の動作を後ろに回しても、時間はそのまま続きます。</p><div id="orderRows"></div>',
    ok: 'この順番にする',
    onOpen: function(){
      const box = document.getElementById('orderRows');
      R.steps.slice(R.idx).forEach(function(s, i){
        const row = document.createElement('div');
        row.className = 'step-edit' + (i === 0 ? ' now' : '');
        row.dataset.i = i;
        row.innerHTML = '<span class="on">' + esc(s.name) + '</span>' +
          '<button type="button" class="btn" title="上へ">↑</button><button type="button" class="btn" title="下へ">↓</button>';
        const btns = row.querySelectorAll('button');
        btns[0].onclick = function(){ if (row.previousElementSibling) box.insertBefore(row, row.previousElementSibling); };
        btns[1].onclick = function(){ if (row.nextElementSibling) box.insertBefore(row.nextElementSibling, row); };
        box.appendChild(row);
      });
    },
    onOk: function(){
      const rest = R.steps.slice(R.idx);
      const order = Array.prototype.map.call(document.querySelectorAll('#orderRows .step-edit'), function(row){
        return rest[Number(row.dataset.i)];
      });
      const before = R.steps[R.idx];
      R.steps = R.steps.slice(0, R.idx).concat(order);
      const now = R.steps[R.idx];
      if (now !== before){
        R.alerted = elapsedMs_() / 1000 >= now.targetSec;
        speak('順番を変えたよ。今は、' + now.name + '。目標' + speakDur_(now.targetSec));
      }
      persistRun_();
      renderRun_();
    }
  });
}

/** 今の動作だけタイマーを0に戻してやり直す（終わった動作の記録はそのまま）。子どものズルを防ぐため親のPINが必要 */
async function restartRun(){
  if (!R || R.askingReason) return;
  const name = R.steps[R.idx].name;
  if (!(await askParentPinOnce_('↺ この動作をやり直す', '「' + name + '」のタイマーを0に戻して、最初からやり直します。ほかの動作の記録は変わりません。'))) return;
  if (!R || R.askingReason) return;
  R.stepStart = Date.now();
  R.pausedAt = null;
  R.pausedMs = 0;
  R.alerted = false;
  R.refillAt = Date.now();
  persistRun_();
  renderRun_();
  speak('もう一回、' + name + '。目標' + speakDur_(R.steps[R.idx].targetSec));
}

/** 親のPINをその場で1回だけ確認する（覚えておかない＝次のときもまた聞く）。OKなら true */
function askParentPinOnce_(title, text){
  const parents = activeMembers_().filter(function(m){ return m.role === '親' && m.hasPin; });
  if (!parents.length) return Promise.resolve(true);
  const bioParents = parents.filter(function(m){ return bioOf_(m.id); });
  return new Promise(function(resolve){
    // このスマホで顔認証を登録している親が1人だけなら、まず顔認証を試す
    if (bioParents.length === 1){
      bioUnlock_(bioParents[0].id).then(function(pin){ if (pin) resolve(true); else openPinModal(); });
    }else openPinModal();

    function openPinModal(){
    openModal({
      title: title,
      body: '<p class="muted">' + esc(text) + '</p><div class="form">' +
        (parents.length > 1 ? '<label>だれのPIN？<select id="onceParent">' + parents.map(function(m){
          return '<option value="' + m.id + '"' + (m.id === S.me ? ' selected' : '') + '>' + esc(m.name) + '</option>';
        }).join('') + '</select></label>' : '') +
        '<label>' + (parents.length > 1 ? '' : esc(parents[0].name) + 'の') + '親PIN（数字4けた）<input type="password" id="oncePin" inputmode="numeric" maxlength="4" autocomplete="new-password"></label></div>' +
        (bioParents.length ? '<button type="button" class="btn block" id="bioBtn">🙂 顔認証で確認</button>' : ''),
      ok: 'OK',
      onOpen: function(){
        setTimeout(function(){ document.getElementById('oncePin').focus(); }, 50);
        const b = document.getElementById('bioBtn');
        if (b) b.onclick = function(){
          const id = parents.length > 1 ? val('onceParent') : parents[0].id;
          if (!bioOf_(id)) return toast('このスマホには ' + member_(id).name + ' の顔認証が登録されていません', 'err');
          bioUnlock_(id).then(function(pin){ if (pin){ show('modal', false); resolve(true); } });
        };
      },
      onOk: async function(){
        const actorId = parents.length > 1 ? val('onceParent') : parents[0].id;
        await gs('verifyParentPin', { token: S.token, actorId: actorId, pin: val('oncePin') });
        resolve(true);
      },
      onCancel: function(){ resolve(false); }
    });
    }
  });
}

function quitRun(){
  if (!R) return;
  const done = R.results.length;
  confirmModal('ルーチンをやめる？',
    done ? 'ここまでの ' + done + 'こ の記録は保存されます。' : 'まだ記録はないので、何も保存されません。',
    'やめる', function(){
      if (done) finishRun_(true);
      else closeRun_();
    });
}

function finishRun_(quit){
  stopTimers_();
  const saved = R.results.reduce(function(sum, x){ return sum + (x.targetSec - x.actualSec); }, 0);
  const memberId = R.memberId;
  const before = streakOf_(memberId).current;
  const payload = {
    runId: R.runId, memberId: R.memberId, routineId: R.routineId, date: R.date, completed: !quit,
    results: R.results.map(function(x){
      return { stepId: x.stepId, name: x.name, targetSec: x.targetSec, actualSec: x.actualSec, reason: x.reason, showRemaining: x.showRemaining };
    })
  };
  const outbox = load_('rt_outbox', []);
  outbox.push(payload);
  save_('rt_outbox', outbox);

  if (!quit) speak('おつかれさま。' + (saved >= 0 ? speakDur_(saved) + '貯金できたよ' : speakDur_(-saved) + 'オーバーだったよ'));
  document.getElementById('runBar').style.width = '100%';
  show('runBody', false);
  show('runDone', true);
  document.getElementById('runDone').innerHTML =
    '<div style="font-size:40px">' + (saved >= 0 ? '🎉' : '💪') + '</div>' +
    '<div class="run-count">' + (quit ? 'ここまでの結果' : 'おつかれさま！') + '</div>' +
    '<div class="done-big ' + (saved < 0 ? 'minus' : 'plus') + '">' + fmtSigned(saved) + '</div>' +
    '<div class="done-table">' + R.results.map(function(x){
      const d = x.targetSec - x.actualSec;
      return '<div class="row"><span>' + esc(x.name) + (x.reason ? '<div class="reason">理由：' + esc(x.reason) + '</div>' : '') +
        '</span><span class="num">' + fmtClock(x.actualSec) + ' <span class="' + (d < 0 ? 'minus' : 'plus') + '">' + fmtSigned(d) + '</span></span></div>';
    }).join('') + '</div>' +
    '<div class="done-streak" id="doneStreak"></div>' +
    '<p class="muted" id="sendState" style="color:#cfe">保存しています…</p>' +
    '<button class="run-next" onclick="closeRun_()">とじる</button>';
  R = null;
  save_('rt_run', null);
  releaseWakeLock_();
  flushOutbox().then(function(){
    const el = document.getElementById('sendState');
    if (!el) return;
    el.textContent = load_('rt_outbox', []).length ? '📡 圏外のため、つながったら自動で保存します' : '✅ 保存しました';
    // 連続が伸びたらお祝い（バッジの日数ちょうどならバッジも。ボーナスが入ったらそれも）
    const now = streakOf_(memberId).current;
    const bonusSec = (S.newBonus || []).filter(function(b){ return b.memberId === memberId; })
      .reduce(function(sum, b){ return sum + b.sec; }, 0);
    S.newBonus = (S.newBonus || []).filter(function(b){ return b.memberId !== memberId; });
    if (quit || (now <= before && !bonusSec)) return;
    const badge = now > before && S.streak.badges.indexOf(now) >= 0;
    document.getElementById('doneStreak').innerHTML = (now > before ? '🔥 <b>' + now + '日連続！</b>' : '') +
      (badge ? '<div class="got-badge">🏅 ' + now + '日バッジ ゲット！</div>' : '') +
      (bonusSec ? '<div class="got-badge">🎁 ボーナス ' + fmtDur(bonusSec) + ' が貯金に入ったよ</div>' : '');
    setTimeout(function(){
      speak((now > before ? now + '日連続' + (badge ? '。' + now + '日バッジ、ゲット！' : '！') : '') +
        (bonusSec ? 'ボーナス、' + speakDur_(bonusSec) + '。' : ''));
    }, 2500);
  });
}

function closeRun_(){
  stopTimers_();
  R = null;
  save_('rt_run', null);
  releaseWakeLock_();
  show('runScreen', false);
  if (S.token && member_(S.me)) switchView(S.view);
  else location.reload();   // 圏外で起動していたときは読み込み直す
}

/** 送信待ちの結果を順番に送る。圏外ならそこで止めて、次の機会に送り直す */
let flushing = false;
async function flushOutbox(){
  if (flushing || !S.token) return;
  flushing = true;
  try{
    let outbox = load_('rt_outbox', []);
    while (outbox.length){
      const p = outbox[0];
      try{
        const res = await gs('saveRun', Object.assign({ token: S.token }, p));
        S.balances = res.balances;
        if (res.streak) S.streak = res.streak;
        if (res.bonus && res.bonus.length) S.newBonus = (S.newBonus || []).concat(res.bonus);
      }catch(err){
        if (err.network) break;
        toastErr(new Error('記録を保存できませんでした：' + errText(err)));
      }
      outbox = load_('rt_outbox', []).slice(1);
      save_('rt_outbox', outbox);
    }
  }finally{
    flushing = false;
  }
  if (S.view === 'timer' && !document.getElementById('main').classList.contains('hidden')) renderTimerView();
}

function renderOutbox(){
  const n = load_('rt_outbox', []).length;
  const el = document.getElementById('outboxCard');
  el.classList.toggle('hidden', !n);
  el.innerHTML = n ? '📡 まだ送れていない記録が ' + n + ' 件あります。 <button class="btn tiny" onclick="flushOutbox()">いま送る</button>' : '';
}

async function requestWakeLock_(){

}
function releaseWakeLock_(){

  wakeLock = null;
}

/* 声の設定（端末ごと・rt_voice）。voice は声の名前（voiceURI）、空ならスマホのおまかせ */
const VOICE_DEFAULT = { on: true, voice: '', rate: 1.05, pitch: 1, volume: 1 };
function voicePref_(){ return Object.assign({}, VOICE_DEFAULT, load_('rt_voice', {})); }

/** スマホに入っている日本語の声（読み込みが遅れる機種があるので毎回取り直す） */
function jaVoices_(){
  try{
    return speechSynthesis.getVoices().filter(function(v){ return /^ja/i.test(v.lang); });
  }catch(e){ return []; }
}

/**
 * 読み上げ。onStatus を渡すと、うまくいったか・何で失敗したかを文字で教えてくれる（設定の「試しに聞く」用）。
 * AndroidのChromeは cancel() の直後に speak() すると声が消えることがあるので、止めたあと少し待ってから読む。
 */
let speakSeq = 0;
function speak(text, onStatus){
  const report = onStatus || function(){};
  try{
    if (!('speechSynthesis' in window)){ report('⚠️ このブラウザは読み上げに対応していません'); return; }
    const pref = voicePref_();
    if (!pref.on){ report('「声で案内する」がオフになっています'); return; }
    const seq = ++speakSeq;   // 新しい読み上げが来たら、古いものは読まない
    const go = function(){
      if (seq !== speakSeq) return;
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ja-JP';
      const v = jaVoices_().filter(function(x){ return x.voiceURI === pref.voice; })[0];
      if (v) u.voice = v;
      u.rate = pref.rate;
      u.pitch = pref.pitch;
      u.volume = pref.volume;
      let started = false;
      u.onstart = function(){ started = true; report('▶ 読み上げ中…（声：' + (v ? v.name : 'おまかせ') + '）'); };
      u.onend = function(){ if (started) report('✅ 読み上げました。聞こえなかったら「メディアの音量」を上げてください'); };
      u.onerror = function(e){
        if (seq === speakSeq && e.error !== 'interrupted' && e.error !== 'canceled') report('⚠️ 読み上げエラー：' + e.error);
      };
      speechSynthesis.resume();   // Chromeは一時停止のまま固まることがある
      speechSynthesis.speak(u);
      setTimeout(function(){
        if (!started && seq === speakSeq) report('⚠️ 読み上げが始まりません。Androidなら「Google 音声サービス」の日本語の声が入っているか確認してください');
      }, 3000);
    };
    if (speechSynthesis.speaking || speechSynthesis.pending){
      speechSynthesis.cancel();
      setTimeout(go, 150);
    }else{
      go();
    }
  }catch(e){ report('⚠️ ' + e.message); }
}

function testVoice(){
  const el = document.getElementById('voiceStatus');
  el.textContent = '準備中…';
  speak('次は、歯みがき。目標3分', function(msg){ el.textContent = msg; });
}
function speakDur_(sec){
  sec = Math.abs(Math.round(sec));
  const m = Math.floor(sec / 60), s = sec % 60;
  return (m ? m + '分' : '') + (s || !m ? s + '秒' : '');
}
