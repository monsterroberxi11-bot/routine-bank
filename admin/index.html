/* ── 銀行タブ（ATMのように操作する）─────────────────────────
   メニュー（預け入れ・引き出し・残高照会）→ キャッシュカードを入れる → 暗証番号 → 金額 → 確認 → 明細。
   暗証番号は1人ずつ（最初に使うときに決める）。3回まちがえるとロックされ、親が設定からリセットする。
   最初のメニューでは金額を見せない。数字は下のテンキーで入れる（パソコンでは数字キー・BackSpace・Enter でも） */

const ATM = { mode: 'menu', kind: '', digits: '', unit: 'min', all: false, pin: '', newPin: '', pinOk: '', result: null, busy: false };
const PIN_MODES = ['pin', 'pinSet1', 'pinSet2'];
let atmTimer = 0;

function cardHtml_(m, cls){
  const no = ('0000' + String(m.id).replace(/\D/g, '')).slice(-4);
  return '<div class="ccard ' + (cls || '') + '"><div class="cc-top"><span class="cc-logo">🏦 Routine Bank</span><span class="cc-type">CASH CARD</span></div>' +
    '<div class="cc-chip"></div><div class="cc-no">****&nbsp;&nbsp;****&nbsp;&nbsp;****&nbsp;&nbsp;' + no + '</div>' +
    '<div class="cc-name">' + esc(m.name) + '　様</div></div>';
}

/** 本物のATMのような 3列×5段のテンキー。取消＝取引をやめる、訂正＝入れた数字を消す、
 *  全部＝預け入れなら手元を全部・引き出しなら銀行を全部（秒まで）、
 *  秒・分＝決定（ATMの「円」キーと同じ。「30」「秒」で30秒、「15」「分」で15分） */
const ATM_KEYS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '取消', '0', '訂正', '全部', '秒', '分'];
function keypadHtml_(extra){
  const cls = { '取消': ' cancel', '訂正': ' fix', '全部': ' unit', '秒': ' ok', '分': ' ok' };
  return '<div class="atm-keys">' + ATM_KEYS.map(function(k){
      return '<button class="atm-key' + (cls[k] || '') + '" onclick="atmKey(\'' + k + '\')"' + (ATM.busy ? ' disabled' : '') + '>' + k + '</button>';
    }).join('') + '</div>' + (extra ? '<div class="btn-row atm-actions">' + extra + '</div>' : '');
}

function renderGinko(){
  const el = document.getElementById('atm');
  const head = '<div class="atm-head">🏦 Routine Bank ATM</div>';
  const back = '<button class="btn atm-back" onclick="atmEnd()">← 取引をやめる</button>';
  const me = member_(S.me);
  const b = bal_(S.me);

  if (ATM.mode === 'menu'){
    el.innerHTML = head + '<div class="atm-screen"><p class="atm-msg">いらっしゃいませ。<br>お取引を選んでください。</p></div>' +
      '<div class="atm-menu">' +
        '<button class="atm-btn" onclick="atmStart(\'in\')"><span class="ico">💴</span>預け入れ</button>' +
        '<button class="atm-btn" onclick="atmStart(\'out\')"><span class="ico">💵</span>引き出し</button>' +
        '<button class="atm-btn wide" onclick="atmStart(\'balance\')"><span class="ico">🧾</span>残高照会</button>' +
      '</div>';
    return;
  }

  if (ATM.mode === 'card'){
    el.innerHTML = head + '<div class="atm-screen"><p class="atm-msg">キャッシュカードを入れています…</p>' +
      '<div class="cc-slot">' + cardHtml_(me, 'inserting') + '</div></div>' + back;
    return;
  }

  if (ATM.mode === 'locked'){
    el.innerHTML = head + '<div class="atm-screen">' + cardHtml_(me, 'small') +
      '<p class="atm-msg err">このカードはロックされています。</p><p class="atm-note">暗証番号を' + 3 + '回まちがえました。<br>親に「設定 → メンバー → 暗証番号リセット」をしてもらってね。</p></div>' + back;
    return;
  }

  if (PIN_MODES.indexOf(ATM.mode) >= 0){
    const msg = { pin: '暗証番号を入れてください', pinSet1: 'はじめて使うカードです。<br>暗証番号（4けた）を決めてください', pinSet2: '確認のため、もう一度入れてください' }[ATM.mode];
    el.innerHTML = head + '<div class="atm-screen">' + cardHtml_(me, 'small') + '<p class="atm-msg">' + msg + '</p>' +
      '<div class="atm-pin">' + [0, 1, 2, 3].map(function(i){ return '<span class="' + (i < ATM.pin.length ? 'on' : '') + '"></span>'; }).join('') + '</div>' +
      (ATM.mode === 'pinSet1' ? '<p class="atm-note">家族に見られないように入れてね。忘れたら親にリセットしてもらえます。</p>' : '') +
      (ATM.busy ? '<p class="atm-note">確認しています…</p>' : '') + '</div>' +
      keypadHtml_();
    return;
  }

  if (ATM.mode === 'amount'){
    const isIn = ATM.kind === 'in';
    const limit = isIn ? Math.max(0, Math.floor(b.balanceSec / 60)) : b.bankSec;
    el.innerHTML = head + '<div class="atm-screen">' +
      '<p class="atm-msg">' + (isIn ? '預け入れる時間を入れてください' : '引き出す時間を入れてください') + '</p>' +
      '<div class="atm-amount"><span id="atmDigits">' + (ATM.all ? '全部' : (ATM.digits || '0')) + '</span></div>' +
      '<p class="atm-note">' + (isIn ? '手元から ' + limit + '分 まで預けられます' : '銀行から ' + fmtDur(limit) + ' まで引き出せます') +
      '<br>入れたら「分」か「秒」を押してください</p></div>' +
      keypadHtml_();
    return;
  }

  if (ATM.mode === 'confirm'){
    const isIn = ATM.kind === 'in';
    el.innerHTML = head + '<div class="atm-screen">' +
      '<p class="atm-msg">' + (isIn ? '預け入れ' : '引き出し') + '</p>' +
      '<div class="atm-amount">' + (ATM.all ? '全部' : ATM.digits) + '<small>' + (ATM.all ? '' : ATM.unit === 'sec' ? '秒' : '分') + '</small></div>' +
      '<p class="atm-msg">よろしいですか？</p></div>' +
      '<div class="btn-row atm-actions"><button class="btn" onclick="atmGo(\'amount\')">いいえ（訂正）</button>' +
      '<button class="btn primary" id="atmOk" onclick="atmExecute()"' + (ATM.busy ? ' disabled' : '') + '>' + (ATM.busy ? '処理中…' : 'はい') + '</button></div>';
    return;
  }

  // 取引の終わり①：カードが出てくる。カードを押す（取る）と②へ
  if (ATM.mode === 'eject'){
    el.innerHTML = head + '<div class="atm-screen"><p class="atm-msg">💳 カードをお取りください</p>' +
      '<div class="cc-slot eject" onclick="atmTakeCard()">' + cardHtml_(me, 'ejecting') + '</div>' +
      '<p class="atm-note">カードを押すと取れます</p></div>';
    return;
  }

  // 取引の終わり②：ご利用ありがとうございました（預け入れ・引き出しのときは明細も）
  if (ATM.mode === 'thanks'){
    const r = ATM.result;
    el.innerHTML = head + '<div class="atm-screen"><p class="atm-msg">ご利用ありがとうございました</p>' +
      (r ? '<div class="atm-receipt"><div class="t">ご利用明細</div>' +
        '<div class="row"><span>' + (r.kind === 'in' ? '預け入れ' : '引き出し') + '</span><b>' + fmtDur(r.sec) + '</b></div>' +
        '<div class="row"><span>銀行の残高</span><b>' + fmtDur(r.bankSec) + '</b></div>' +
        '<div class="row"><span>手元の時間貯金</span><b>' + fmtDur(r.handSec) + '</b></div>' +
        '<div class="row sub"><span>' + esc(r.at) + '</span></div></div>' : '') + '</div>' +
      (r ? '<div class="btn-row atm-actions"><button class="btn primary" onclick="atmGo(\'menu\')">メニューに戻る</button></div>' : '');
    return;
  }

  // 残高照会
  const rows = S.interest.history.filter(function(h){ return h.memberId === me.id; }).slice(0, 30);
  el.innerHTML = head + '<div class="atm-screen"><p class="atm-msg">残高照会</p>' +
    '<div class="atm-amount">' + fmtDur(b.bankSec) + '</div><p class="atm-note">👛 手元の時間貯金 ' + fmtDur(b.balanceSec) + '</p></div>' +
    '<div class="card" id="interestCard"></div>' +
    '<div class="card"><h2>通帳</h2><div class="list">' + (rows.map(function(h){
      const out = h.kind === '引き出し';
      const title = h.kind === '利息' ? '💹 利息（' + fmtWeek_(h.week) + '）' : out ? '💵 引き出し' : '💴 預け入れ';
      const sub = h.kind === '利息' ? fmtDur(h.baseSec) + ' × ' + fmtNum(h.rate) + '％' : esc(String(h.at).slice(5, 16));
      return '<div class="list-item"><div class="main"><div class="title">' + title + '</div><div class="sub">' + sub + '</div></div>' +
        '<div class="val ' + (out ? 'minus' : 'plus') + '">' + (out ? '−' : '+') + fmtDur(h.sec) + '</div></div>';
    }).join('') || '<p class="empty">まだありません</p>') + '</div></div>' +
    '<button class="btn primary atm-back" onclick="atmEnd()">取引を終わる</button>';
  renderInterest_(me);
}

/** 取引を終える：カードを出す（明細は ATM.result。取消・残高照会のときは null） */
function atmEnd(result){
  ATM.result = result || null;
  ATM.pin = ''; ATM.pinOk = ''; ATM.newPin = '';
  atmGo('eject');
}

/** カードを取る → ご利用ありがとうございました → （明細がなければ少しして）メニューへ */
function atmTakeCard(){
  if (ATM.mode !== 'eject') return;
  atmGo('thanks');
  if (!ATM.result) atmTimer = setTimeout(function(){ atmGo('menu'); }, 2200);
}

function atmGo(mode){
  clearTimeout(atmTimer);
  const changed = ATM.mode !== mode;
  ATM.mode = mode;
  if (mode === 'menu'){ ATM.kind = ''; ATM.digits = ''; ATM.all = false; ATM.pin = ''; ATM.newPin = ''; ATM.pinOk = ''; }
  renderGinko();
  if (changed || mode === 'menu') speak(atmGuide_(mode));
}

/** 画面ごとの読み上げ。暗証番号の数字と残高の金額は読まない（まわりの人に聞こえてしまうので） */
function atmGuide_(mode){
  const isIn = ATM.kind === 'in';
  switch (mode){
    case 'menu':    return 'いらっしゃいませ。お取引を選んでください';
    case 'card':    return 'キャッシュカードを入れています';
    case 'pin':     return '暗証番号を入力してください';
    case 'pinSet1': return '暗証番号を決めて、入力してください';
    case 'pinSet2': return '確認のため、もう一度入力してください';
    case 'locked':  return 'このカードはロックされています。親に解除してもらってください';
    case 'amount':  return (isIn ? '預け入れる' : '引き出す') + '時間を入力して、分か、秒を押してください';
    case 'confirm': return (ATM.all ? '全部' : ATM.digits + (ATM.unit === 'sec' ? '秒' : '分')) + 'を' + (isIn ? '預け入れます' : '引き出します') + '。よろしければ、はいを押してください';
    case 'eject':   return 'カードをお取りください';
    case 'thanks':  return 'ご利用ありがとうございました';
    case 'balance': return '残高を表示しています';
  }
  return '';
}

/** ATMのまちがい：お知らせを出して、読み上げる */
function atmErr_(msg){
  toast(msg, 'err');
  speak(msg.replace(/（.*?）/g, ''));
}

/** メニューのボタン → カードを入れる動き → 暗証番号（まだなければ決める） */
function atmStart(kind){
  ATM.kind = kind; ATM.digits = ''; ATM.all = false; ATM.pin = ''; ATM.newPin = ''; ATM.pinOk = '';
  atmGo('card');
  atmTimer = setTimeout(function(){
    const me = member_(S.me);
    atmGo(me.atmLocked ? 'locked' : me.hasAtmPin ? 'pin' : 'pinSet1');
  }, 1300);
}

function atmKey(k){
  if (ATM.busy) return;
  if (k === '取消') return atmEnd();
  if (k === '分' || k === '秒'){ ATM.unit = k === '秒' ? 'sec' : 'min'; return atmOk(); }
  const pinMode = PIN_MODES.indexOf(ATM.mode) >= 0;
  if (pinMode){
    if (k === '訂正') ATM.pin = '';
    else if (k === '⌫') ATM.pin = ATM.pin.slice(0, -1);          // パソコンの BackSpace
    else if (/^\d$/.test(k)) ATM.pin = (ATM.pin + k).slice(0, 4);   // 全部は暗証番号では使わない
    renderGinko();
    if (ATM.pin.length === 4) atmPinOk();                        // 本物のATMと同じく、4けた入れたら自動で進む
    return;
  }
  if (k === '訂正'){ ATM.digits = ''; ATM.all = false; }
  else if (k === '⌫'){ ATM.all = false; ATM.digits = ATM.digits.slice(0, -1); }
  else if (k === '全部'){
    ATM.all = true; ATM.digits = '';   // 預け入れは手元を全部・引き出しは銀行を全部（どちらも秒まで）
  }
  else if (/^\d$/.test(k)){ ATM.all = false; ATM.digits = (ATM.digits + k).replace(/^0+/, '').slice(0, 8); }
  renderGinko();
}

/** テンキーの「確認」：暗証番号の画面か、金額の画面かで動きが変わる */
function atmOk(){
  if (PIN_MODES.indexOf(ATM.mode) >= 0) return atmPinOk();
  if (ATM.mode === 'amount') return atmConfirm();
}

/** 暗証番号のあと：預け入れ・引き出しは金額へ、残高照会は残高へ */
function atmAfterPin_(pin){
  ATM.pinOk = pin; ATM.pin = '';
  atmGo(ATM.kind === 'balance' ? 'balance' : 'amount');
}

async function atmPinOk(){
  if (ATM.busy) return;
  if (ATM.pin.length !== 4) return atmErr_('4けたで入れてください');
  const me = member_(S.me);
  if (ATM.mode === 'pinSet1'){ ATM.newPin = ATM.pin; ATM.pin = ''; return atmGo('pinSet2'); }
  ATM.busy = true; renderGinko();
  try{
    if (ATM.mode === 'pinSet2'){
      if (ATM.pin !== ATM.newPin){ ATM.busy = false; ATM.pin = ''; ATM.newPin = ''; toast('2回の暗証番号がちがいます。もう一度決めてね', 'err'); atmGo('pinSet1'); return speak('2回の暗証番号が違います。もう一度、決めてください'); }
      await gs('setAtmPin', { token: S.token, memberId: me.id, newPin: ATM.pin });
      me.hasAtmPin = true;
      ATM.busy = false;
      toast('暗証番号を決めました', 'ok');
      return atmAfterPin_(ATM.newPin);
    }
    const res = await gs('verifyAtmPin', { token: S.token, memberId: me.id, atmPin: ATM.pin });
    ATM.busy = false;
    if (res.ok) return atmAfterPin_(ATM.pin);
    ATM.pin = '';
    if (res.locked){ me.atmLocked = true; return atmGo('locked'); }
    atmErr_(res.message);
    renderGinko();
  }catch(err){ ATM.busy = false; ATM.pin = ''; renderGinko(); toastErr(err); }
}

/** 入れた金額（秒）。全部のときは手元／銀行の残り全部 */
function atmAmountSec_(){
  const b = bal_(S.me);
  if (ATM.all) return Math.max(0, ATM.kind === 'in' ? b.balanceSec : b.bankSec);
  return Number(ATM.digits || 0) * (ATM.unit === 'sec' ? 1 : 60);
}

function atmConfirm(){
  const sec = atmAmountSec_();
  if (!ATM.all && sec < 1) return atmErr_('数字を入れてから「分」か「秒」を押してください');
  const b = bal_(S.me);
  if (ATM.kind === 'in' && (ATM.all ? sec < 1 : sec > b.balanceSec)) return atmErr_(ATM.all ? '手元に時間貯金がありません' : '手元の時間貯金が足りません');
  if (ATM.kind === 'out' && (ATM.all ? sec < 1 : sec > b.bankSec)) return atmErr_(ATM.all ? '銀行に時間がありません' : '銀行の残高が足りません');
  atmGo('confirm');
}

async function atmExecute(){
  if (ATM.busy) return;
  ATM.busy = true; renderGinko();
  const before = bal_(S.me).bankSec;
  try{
    const res = await gs(ATM.kind === 'in' ? 'bankDeposit' : 'bankWithdraw',
      { token: S.token, memberId: S.me, atmPin: ATM.pinOk, sec: ATM.all ? '' : atmAmountSec_(), all: ATM.all });
    S.balances = res.balances;
    S.interest = res.interest;
    const after = bal_(S.me);
    ATM.result = { kind: ATM.kind, sec: Math.abs(after.bankSec - before), bankSec: after.bankSec, handSec: after.balanceSec,
                   at: new Date().toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) };
    ATM.busy = false;
    atmEnd(ATM.result);
  }catch(err){
    ATM.busy = false; renderGinko();
    toastErr(err);
  }
}

/* ボタンの「ピッ」。音のファイルは使わず、その場で短い音を作る（本物のATMに近い高めの音）。
   大きさは設定の「声の音量」に合わせる（0なら鳴らさない） */
let atmAudio = null;
function atmBeep(){
  try{
    const vol = Number(voicePref_().volume);
    if (!vol) return;
    atmAudio = atmAudio || new (window.AudioContext || window.webkitAudioContext)();
    if (atmAudio.state === 'suspended') atmAudio.resume();
    const t = atmAudio.currentTime;
    const osc = atmAudio.createOscillator();
    const gain = atmAudio.createGain();
    osc.type = 'square';
    osc.frequency.value = 2000;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.08 * vol, t + 0.005);
    gain.gain.setValueAtTime(0.08 * vol, t + 0.07);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
    osc.connect(gain);
    gain.connect(atmAudio.destination);
    osc.start(t);
    osc.stop(t + 0.1);
  }catch(e){ /* 音が出せない機種でも、ATMはそのまま使える */ }
}

// ATMのボタン・カードを押したら「ピッ」
document.addEventListener('pointerdown', function(e){
  const el = e.target.closest && e.target.closest('#atm button, #atm .cc-slot.eject');
  if (el && !el.disabled) atmBeep();
}, true);

// パソコンのキーボードでも操作できるように（銀行タブを開いているときだけ）
document.addEventListener('keydown', function(e){
  if (S.view !== 'ginko' || e.isComposing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (!document.getElementById('modal').classList.contains('hidden')) return;
  if (ATM.mode === 'amount' || PIN_MODES.indexOf(ATM.mode) >= 0){
    if (/^\d$/.test(e.key)){ e.preventDefault(); atmBeep(); atmKey(e.key); }
    else if (e.key === 'Backspace'){ e.preventDefault(); atmBeep(); atmKey('⌫'); }
    else if (e.key === 'Enter'){ e.preventDefault(); atmBeep(); atmKey('分'); }
    else if (e.key === 'Escape'){ atmBeep(); atmKey('取消'); }
  }else if (ATM.mode === 'confirm'){
    if (e.key === 'Enter'){ e.preventDefault(); atmBeep(); atmExecute(); }
    else if (e.key === 'Escape'){ atmBeep(); atmGo('amount'); }
  }else if (ATM.mode === 'eject' && e.key === 'Enter'){ e.preventDefault(); atmBeep(); atmTakeCard(); }
  else if (ATM.mode === 'thanks' && e.key === 'Enter'){ e.preventDefault(); atmBeep(); atmGo('menu'); }
  else if (ATM.mode === 'balance' && e.key === 'Enter'){ e.preventDefault(); atmBeep(); atmEnd(); }
});

/** 利息のカード：しくみと今週の見込み */
function renderInterest_(m){
  const it = S.interest;
  const pv = it.preview[m.id] || { minSec: 0, previewSec: 0 };
  document.getElementById('interestCard').innerHTML = '<h2>💹 利息</h2>' + (it.rate
    ? '<p class="muted">毎週月曜日に、先週の銀行の残高で<b>いちばん少なかったとき</b>の <b>' + fmtNum(it.rate) + '％</b> が利息として付きます。長く預けておくほど増えます。</p>' +
      '<div class="stat-row two"><div class="stat"><div class="k">今週の見込み</div><div class="v plus">+' + fmtDur(pv.previewSec) + '</div></div>' +
      '<div class="stat"><div class="k">今週いちばん少なかった残高</div><div class="v">' + fmtDur(pv.minSec) + '</div></div></div>'
    : '<p class="muted">今は利息がお休みです（親が設定で利率を決められます）。</p>');
}

/** '2026-10-12' → '10/12〜10/18' */
function fmtWeek_(week){
  const d = new Date(week + 'T00:00:00');
  const e = new Date(d.getTime() + 6 * 86400000);
  return (d.getMonth() + 1) + '/' + d.getDate() + '〜' + (e.getMonth() + 1) + '/' + e.getDate();
}

function renderPending_(rows){
  const meIsParent = member_(S.me).role === '親';
  S.pendingCount = rows.length;
  renderNav();
  document.getElementById('pendingList').innerHTML = rows.map(function(x){
    let actions = '';
    if (meIsParent) actions = '<button class="btn tiny primary" onclick="decide(\'' + x.id + '\', true)">承認</button>' +
                              '<button class="btn tiny danger" onclick="decide(\'' + x.id + '\', false)">却下</button>';
    else if (x.memberId === S.me) actions = '<button class="btn tiny" onclick="cancelExchange(\'' + x.id + '\')">取消</button>';
    return '<div class="list-item"><div class="main"><div class="title">' + esc(x.memberName) + '：' + esc(x.rewardName) +
      ' <span class="val">' + fmtNum(x.value) + esc(x.unit) + '</span></div>' +
      '<div class="sub">' + fmtDur(x.sec) + 'を使う・' + esc(x.at.slice(5, 16)) + (x.memo ? '・' + esc(x.memo) : '') + '</div></div>' +
      '<div class="actions">' + actions + '</div></div>';
  }).join('') || '<p class="empty">承認待ちはありません</p>';
}

function renderExchangeHistory_(rows){
  const badge = { '承認': 'ok', '却下': 'ng', '取消': 'gray' };
  document.getElementById('exchangeList').innerHTML = rows.map(function(x){
    return '<div class="list-item"><div class="main"><div class="title">' + esc(x.rewardName) + ' ' + fmtNum(x.value) + esc(x.unit) +
      ' <span class="badge ' + (badge[x.status] || 'gray') + '">' + esc(x.status) + '</span></div>' +
      '<div class="sub">' + esc(x.at.slice(0, 16)) + '・' + fmtDur(x.sec) + (x.decidedBy ? '・' + esc(x.decidedBy) : '') +
      (x.rejectReason ? '・理由：' + esc(x.rejectReason) : '') + '</div></div>' +
      '<div class="val minus">' + (x.status === '承認' ? '−' + fmtDur(x.sec) : '') + '</div></div>';
  }).join('') || '<p class="empty">まだありません</p>';
}

function renderRuns_(runs){
  const meIsParent = member_(S.me).role === '親';
  document.getElementById('runList').innerHTML = runs.map(function(r, i){
    const allCanceled = r.activeCount === 0;
    const label = esc(r.routineName) + '（' + esc(r.date) + '）';
    const trash = meIsParent && !allCanceled
      ? '<button class="btn tiny danger" title="この回をまるごと無効" onclick="event.stopPropagation(); cancelRun(\'' + r.runId + '\', \'\', \'' + label + '\')">🗑</button>' : '';
    return '<div class="list-item col' + (allCanceled ? ' canceled' : '') + '"><div class="list-head" onclick="toggle(\'run' + i + '\')"><div class="main">' +
      '<div class="title">' + esc(r.routineName) + (allCanceled ? ' <span class="badge gray">無効</span>' : '') + '</div>' +
      '<div class="sub">' + esc(r.date) + '・' + r.steps.length + 'こ・タップで内訳</div></div>' +
      '<div class="val ' + (allCanceled ? '' : sign_(r.savedSec)) + '">' + (allCanceled ? '—' : fmtSigned(r.savedSec)) + '</div>' + trash + '</div>' +
      '<div class="steps-mini hidden" id="run' + i + '">' + r.steps.map(function(s){
        const del = meIsParent && !s.canceled
          ? ' <button class="btn tiny danger step-del" title="この動作だけ無効" onclick="cancelRun(\'' + r.runId + '\', \'' + s.logId + '\', \'' + esc(s.name) + '\')">🗑</button>' : '';
        return '<div class="row' + (s.canceled ? ' canceled' : '') + '"><span>' + (s.hidden ? '🙈 ' : '') + esc(s.name) + '</span><span class="num">' +
          fmtClock(s.actualSec) + ' / ' + fmtClock(s.targetSec) +
          ' <b class="' + (s.canceled ? '' : sign_(s.savedSec)) + '">' + fmtSigned(s.savedSec) + '</b>' + del + '</span></div>' +
          (s.reason ? '<div class="reason">理由：' + esc(s.reason) + '</div>' : '') +
          (s.canceled ? '<div class="reason">🚫 無効' + (s.cancelReason ? '：' + esc(s.cancelReason) : '') + '</div>' : '');
      }).join('') + '</div></div>';
  }).join('') || '<p class="empty">まだ記録がありません</p>';
}

function openExchange(rewardId){
  const w = S.rewards.filter(function(x){ return x.id === rewardId; })[0];
  const maxMin = Math.floor(bal_(S.me).balanceSec / 60);
  openModal({
    title: '🎁 ' + w.name + 'に交換',
    body: '<p class="muted">使えるのは ' + maxMin + '分 まで。親が承認したら決まります。</p>' +
      '<div class="form"><label>使う時間（分）<input type="number" id="exMin" min="1" max="' + maxMin + '" value="' + maxMin + '" inputmode="numeric"></label>' +
      '<p id="exPreview" style="font-size:18px;font-weight:800;margin:0 0 10px"></p>' +
      '<label>メモ（なくてもOK）<input type="text" id="exMemo" maxlength="100" placeholder="例：土曜日に使いたい"></label></div>',
    ok: '申請する',
    onOpen: function(){
      const upd = function(){
        const n = Math.max(0, Math.floor(Number(val('exMin')) || 0));
        document.getElementById('exPreview').textContent = n + '分 → ' + fmtNum(Math.round(n * w.perMin * 100) / 100) + w.unit;
      };
      document.getElementById('exMin').oninput = upd;
      upd();
    },
    onOk: async function(){
      const res = await gs('requestExchange', { token: S.token, memberId: S.me, rewardId: w.id, minutes: Number(val('exMin')), memo: val('exMemo') });
      S.balances = res.balances;
      toast(res.message, 'ok');
      renderBank();
    }
  });
}

async function cancelExchange(id){
  try{
    const res = await gs('cancelExchange', { token: S.token, requestId: id });
    S.balances = res.balances;
    toast(res.message, 'ok');
    renderBank();
  }catch(err){ toastErr(err); }
}

async function decide(id, approve){
  const pin = await needPin();
  if (!pin) return;
  const go = async function(reason){
    try{
      const res = await gs('decideExchange', { token: S.token, actorId: S.me, pin: pin, requestId: id, approve: approve, reason: reason || '' });
      S.balances = res.balances;
      toast(res.message, 'ok');
      renderBank();
    }catch(err){ pinFailed_(err); toastErr(err); }
  };
  if (approve) return go('');
  openModal({
    title: '却下する',
    body: '<div class="form"><label>理由（子どもに見えます）<input type="text" id="rjReason" maxlength="100"></label></div>',
    ok: '却下する',
    onOk: function(){ return go(val('rjReason')); }
  });
}

/** 怪しい記録を無効にする（親・PIN）。logId があればその動作だけ、空ならその回まるごと */
async function cancelRun(runId, logId, label){
  const pin = await needPin();
  if (!pin) return;
  openModal({
    title: (logId ? '「' + label + '」だけ' : label + ' をまるごと') + '無効にする？',
    body: '<p class="muted">無効にすると、その分の貯金（プラスもマイナスも）がなかったことになります。記録は消えずに「無効」として残ります。</p>' +
      '<div class="form"><label>理由<input type="text" id="crReason" maxlength="100" placeholder="例：早すぎてあやしい、押しまちがい"></label></div>',
    ok: '無効にする',
    onOk: async function(){
      try{
        const res = await gs('cancelRun', { token: S.token, actorId: S.me, pin: pin, runId: runId, logId: logId || '', reason: val('crReason') });
        toast(res.message, 'ok');
        await refresh();
      }catch(err){ pinFailed_(err); throw err; }
    }
  });
}

async function renderAnalysis(){
  renderMemberSeg_('anMembers', S.anMember, 'pickAnMember');
  document.getElementById('anDays').innerHTML = [7, 30, 90].map(function(d){
    return '<button class="' + (S.anDays === d ? 'active' : '') + '" onclick="pickAnDays(' + d + ')">' + d + '日</button>';
  }).join('');
  const box = document.getElementById('analysis');
  box.innerHTML = '<p class="empty">読み込み中…</p>';
  let a;
  try{ a = await gs('getAnalysis', { token: S.token, memberId: S.anMember, days: S.anDays }); }
  catch(err){ box.innerHTML = ''; toastErr(err); return; }
  if (!a.steps.length){ box.innerHTML = '<div class="card"><p class="empty">この期間の記録がありません</p></div>'; return; }

  const maxReason = a.reasons.length ? a.reasons[0].count : 1;
  box.innerHTML =
    '<div class="card"><h2>👁 表示あり と 🙈 かくす の比べっこ</h2><div class="compare">' +
      modeStat_('👁 残り時間を表示', a.mode.shown) + modeStat_('🙈 かくす', a.mode.hidden) +
    '</div><p class="muted" style="margin:8px 0 0">1つの動作あたりの平均貯金です。</p></div>' +

    '<div class="card"><h2>オーバーしやすい動作</h2><table class="grid"><tr><th>動作</th><th>回数</th><th>オーバー</th><th>平均</th><th>貯金計</th></tr>' +
    a.steps.map(function(s){
      return '<tr><td>' + esc(s.name) + '<div class="muted" style="font-size:11px">' + esc(s.routineName) + '・目標' + fmtClock(s.targetSec) + '</div></td>' +
        '<td>' + s.count + '</td><td class="' + (s.overCount ? 'minus' : '') + '">' + Math.round(s.overRate * 100) + '%</td>' +
        '<td class="num">' + fmtClock(s.avgActual) + '</td><td class="num ' + sign_(s.totalSaved) + '">' + fmtSigned(s.totalSaved) + '</td></tr>';
    }).join('') + '</table></div>' +

    '<div class="card"><h2>オーバーの理由ランキング</h2>' + (a.reasons.map(function(r){
      return '<div class="bar-row"><span class="k">' + esc(r.label) + '</span><span class="track"><span class="fill" style="display:block;width:' +
        Math.round(r.count / maxReason * 100) + '%"></span></span><span class="n">' + r.count + '回</span></div>';
    }).join('') || '<p class="empty">オーバーなし！すごい！</p>') + '</div>' +

    '<div class="card"><h2>最近のオーバー</h2><div class="list">' + (a.overs.map(function(o){
      return '<div class="list-item"><div class="main"><div class="title">' + esc(o.name) + '</div>' +
        '<div class="sub">' + esc(o.date) + '・' + esc(o.routineName) + (o.reason ? '・' + esc(o.reason) : '・理由なし') + '</div></div>' +
        '<div class="val minus">+' + fmtDur(o.overSec) + '</div></div>';
    }).join('') || '<p class="empty">なし</p>') + '</div></div>';
}

function modeStat_(label, m){
  return '<div class="stat"><div class="k">' + label + '</div><div class="v ' + (m.count ? sign_(m.avgSaved) : '') + '">' +
    (m.count ? fmtSigned(m.avgSaved) : '—') + '</div><div class="muted">' + m.count + '回</div></div>';
}
function pickAnMember(id){ S.anMember = id; renderAnalysis(); }
function pickAnDays(d){ S.anDays = d; renderAnalysis(); }

function routineItem_(r){
  const who = r.memberId ? (member_(r.memberId) || { name: '?' }).name + '用' : 'みんな';
  // まだ一度も承認されていないルーチンは、申請内容を見せる
  const shown = r.approved ? r : Object.assign({}, r, r.request || {});
  let badge = shown.active ? '' : ' <span class="badge gray">停止中</span>';
  if (isRequesting_(r)) badge += ' <span class="badge pending">' + (r.approved ? '変更の承認待ち' : '承認待ち') + '</span>';
  else if (r.rejectReason) badge += ' <span class="badge ng">却下</span>';
  return '<div class="list-item"><div class="main"><div class="title">' + esc(shown.name) + badge + '</div>' +
    '<div class="sub">' + who + '・' + stepsText_(shown.steps) + '</div>' +
    (remindText_(shown) ? '<div class="sub">' + remindText_(shown) + '</div>' : '') +
    (r.rejectReason ? '<div class="sub">理由：' + esc(r.rejectReason) + '（直してもう一度申請できます）</div>' : '') + '</div>' +
    '<div class="actions"><button class="btn tiny" onclick="editRoutine(\'' + r.id + '\')">編集</button></div></div>';
}

function stepsText_(steps){
  return steps.length + 'こ・' + steps.map(function(s){ return esc(s.name) + ' ' + fmtDur(s.targetSec); }).join(' → ');
}

/** 親が見る「承認待ちのルーチン」1件分。変更なら今の内容もいっしょに見せる */
function routineRequestItem_(r){
  const q = r.request;
  const who = (member_(r.createdBy) || { name: '?' }).name;
  return '<div class="list-item"><div class="main"><div class="title">' + esc(who) + '：' + (r.approved ? '✏️ 変更' : '🆕 新しく作る') + '「' + esc(q.name) + '」' +
    (q.active ? '' : ' <span class="badge gray">停止にする</span>') + '</div>' +
    '<div class="sub">' + stepsText_(q.steps) + '</div>' +
    (r.approved ? '<div class="sub">今：「' + esc(r.name) + '」' + stepsText_(r.steps) + '</div>' : '') +
    '<div class="sub">' + esc(String(r.requestedAt).slice(5, 16)) + '</div></div>' +
    '<div class="actions"><button class="btn tiny primary" onclick="decideRoutine(\'' + r.id + '\', true)">承認</button>' +
    '<button class="btn tiny danger" onclick="decideRoutine(\'' + r.id + '\', false)">却下</button></div></div>';
}

async function decideRoutine(id, approve){
  const pin = await needPin();
  if (!pin) return;
  const go = async function(reason){
    try{
      const res = await gs('decideRoutine', { token: S.token, actorId: S.me, pin: pin, routineId: id, approve: approve, reason: reason || '' });
      toast(res.message, 'ok');
      await refresh();
    }catch(err){ pinFailed_(err); toastErr(err); }
  };
  if (approve) return go('');
  openModal({
    title: '却下する',
    body: '<div class="form"><label>理由（子どもに見えます）<input type="text" id="rjReason" maxlength="100"></label></div>',
    ok: '却下する',
    onOk: function(){ return go(val('rjReason')); }
  });
}


/** 設定タブの「声の設定」カード（この端末だけの設定） */
function voiceCard_(){
  if (!('speechSynthesis' in window)) {
    return '<div class="card"><h2>声の設定</h2><p class="muted">このブラウザは読み上げに対応していません。</p></div>';
  }
  const pref = voicePref_();
  const voices = jaVoices_();
  const slider = function(id, label, min, max, step, value){
    return '<label>' + label + ' <span class="muted" id="' + id + 'Val">' + value + '</span>' +
      '<input type="range" id="' + id + '" min="' + min + '" max="' + max + '" step="' + step + '" value="' + value + '"' +
      ' oninput="setVoicePref(\'' + id + '\', this.value)" style="width:100%"></label>';
  };
  return '<div class="card"><h2>声の設定</h2><div class="form">' +
    '<label class="inline"><input type="checkbox"' + (pref.on ? ' checked' : '') + ' onchange="setVoicePref(\'on\', this.checked)"> 声で案内する</label>' +
    '<label>声の種類<select onchange="setVoicePref(\'voice\', this.value)"><option value="">おまかせ</option>' +
      voices.map(function(v){
        return '<option value="' + esc(v.voiceURI) + '"' + (v.voiceURI === pref.voice ? ' selected' : '') + '>' + esc(v.name) + '</option>';
      }).join('') + '</select></label>' +
    (voices.length ? '' : '<p class="muted">声の一覧を読み込み中です。出てこないときは少し待ってから設定タブを開き直してください。</p>') +
    slider('rate', '速さ', 0.6, 1.6, 0.05, pref.rate) +
    slider('pitch', '声の高さ', 0.5, 1.8, 0.05, pref.pitch) +
    slider('volume', '音量', 0.1, 1, 0.05, pref.volume) +
    '</div><button class="btn primary" onclick="testVoice()">🔊 試しに聞く</button>' +
    '<p class="muted" id="voiceStatus" style="margin:8px 0 0"></p>' +
    '<p class="muted" style="margin:4px 0 0">この端末の日本語の声：' + voices.length + '種類' +
      (voices.length ? '' : '（見つかりません）') + '</p></div>';
}

function setVoicePref(key, value){
  const pref = voicePref_();
  pref[key] = (key === 'on') ? !!value : (key === 'voice' ? value : Number(value));
  save_('rt_voice', pref);
  const label = document.getElementById(key + 'Val');
  if (label) label.textContent = value;
}

/* ── Home版：データはスマホの中だけなので、バックアップの書き出し・読み込みを用意する ── */
function backupCard_(){
  return '<div class="card"><h2>データの保存（このスマホの中）</h2>' +
    '<p class="muted">データはこのスマホの中だけにあります。機種変更やブラウザのデータ削除で消えてしまうので、ときどきバックアップを書き出してください。</p>' +
    '<div class="btn-row"><button class="btn" onclick="exportBackup()">⬇ バックアップを書き出す</button>' +
    '<label class="btn" style="display:inline-flex; align-items:center; cursor:pointer;">⬆ バックアップから戻す' +
    '<input type="file" accept="application/json,.json" onchange="importBackup(this)" style="display:none"></label></div>' +
    '<div style="margin-top:12px"><button class="btn danger" onclick="clearLocalData()">このスマホのデータを全部消す</button></div></div>';
}

function exportBackup(){
  const text = LocalStore.exportAll({ token: S.token, familyName: S.familyName });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = 'RoutineBankHome_' + localDate_() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);

}

async function unlockSettings(){

}

/** 親のPINを聞いて確認する。確認できたらPINを返す（この画面を開いている間は覚えておく） */
function needPin(){
  if (member_(S.me).role !== '親'){ toast('この操作は親だけができます', 'err'); return Promise.resolve(''); }
  return askPin_(S.me);
}

/** 親 memberId のPINを聞いてサーバーで確認する。確認できたらPIN、やめたら '' を返す */
function askPin_(memberId){
  const m = member_(memberId);
  if (!m.hasPin) return Promise.resolve('-');   // PIN未設定の親（通常は起きない）はそのまま通す
  if (S.parentPin && S.pinFor === memberId) return Promise.resolve(S.parentPin);
  return new Promise(function(resolve){
    const done = function(pin){ S.parentPin = pin; S.pinFor = memberId; resolve(pin); };
    const openPinModal = function(){
      openModal({
        title: '🔒 ' + m.name + 'のPIN',
        body: '<div class="form"><label>数字4けた<input type="password" id="pinInput" inputmode="numeric" maxlength="4" autocomplete="new-password"></label></div>' +
          (bioOf_(memberId) ? '<button type="button" class="btn block" id="bioBtn">🙂 顔認証で開く</button>' : ''),
        ok: 'OK',
        onOpen: function(){
          setTimeout(function(){ document.getElementById('pinInput').focus(); }, 50);
          const b = document.getElementById('bioBtn');
          if (b) b.onclick = function(){
            bioUnlock_(memberId).then(function(pin){ if (pin){ show('modal', false); done(pin); } });
          };
        },
        onOk: async function(){
          const pin = val('pinInput');
          await gs('verifyParentPin', { token: S.token, actorId: memberId, pin: pin });
          done(pin);
        },
        onCancel: function(){ resolve(''); }
      });
    };
    // 顔認証を登録していれば先に試す。やめた・失敗したらPINの窓
    if (bioOf_(memberId)) bioUnlock_(memberId).then(function(pin){ if (pin) done(pin); else openPinModal(); });
    else openPinModal();
  });
}

/* ── 顔認証（パスキー）────────────────────────
   スマホの顔認証・指紋（合わないときはスマホの画面ロック）で本人確認して、
   このスマホに覚えておいたPINを使う。サーバーには今までどおりPINを送るので、サーバー側は変えていない。
   登録はスマホごと・親ごと。PINが変わっていたら登録を消してPINを聞く。 */

function bioKey_(memberId){ return 'rt_bio_' + (IS_LOCAL ? 'home_' : '') + S.familyName + '_' + memberId; }
function bioOf_(memberId){ return window.PublicKeyCredential ? load_(bioKey_(memberId), null) : null; }

function randBytes_(n){ return crypto.getRandomValues(new Uint8Array(n)); }
function b64uEnc_(buf){
  return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64uDec_(str){
  const bin = atob(str.replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(bin, function(c){ return c.charCodeAt(0); });
}

/** 顔認証してPINを返す。やめた・失敗したら '' */
async function bioUnlock_(memberId){
  const b = bioOf_(memberId);
  if (!b) return '';
  try{
    await navigator.credentials.get({ publicKey: {
      challenge: randBytes_(32), allowCredentials: [{ type: 'public-key', id: b64uDec_(b.credId) }],
      userVerification: 'required', timeout: 60000 } });
  }catch(e){ return ''; }   // やめた・顔が合わない・ボタンを押さずに呼ばれた（iPhone）など → PINへ
  try{
    await gs('verifyParentPin', { token: S.token, actorId: memberId, pin: b.pin });
    return b.pin;
  }catch(err){
    if (/PIN/.test(errText(err))){
      save_(bioKey_(memberId), null);
      toast('PINが変わっていたので、顔認証をオフにしました。PINを入れてください（設定からまたオンにできます）', 'err');
    }else toastErr(err);
    return '';
  }
}

function bioCard_(){
  const me = member_(S.me);
  if (!window.PublicKeyCredential || !navigator.credentials || me.role !== '親' || !me.hasPin) return '';
  const on = !!bioOf_(S.me);
  return '<div class="card"><h2>🙂 顔認証（このスマホ）</h2><p class="muted">' +
    (on ? '<b>オン</b>：PINを聞かれたとき、先に顔認証（または指紋）で開けます。'
        : 'オンにすると、PINの代わりに顔認証（または指紋）で開けます。このスマホの' + esc(me.name) + 'だけの設定です。') +
    ' 顔が合わないときはスマホの画面ロックの番号でも通るので、子どもがロックの番号を知っているスマホではオンにしないでください。</p>' +
    (on ? '<button class="btn" onclick="bioOff()">オフにする</button>' : '<button class="btn primary" onclick="bioSetup()">オンにする</button>') + '</div>';
}

async function bioSetup(){
  let can = false;
  try{ can = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); }catch(e){}
  if (!can) return toast('このスマホ（ブラウザ）では顔認証・指紋が使えません', 'err');
  const pin = await needPin();   // まず今のPINで本人確認
  if (!pin || pin === '-') return;
  const me = member_(S.me);
  // 顔認証の画面はボタンを押した直後にしか出せない（iPhone）ので、もう1回押してもらう
  openModal({
    title: '🙂 顔認証をオンにする',
    body: '<p>「登録する」を押すと、スマホの顔認証（または指紋）の画面が出ます。</p>',
    ok: '登録する',
    onOk: async function(){
      let cred;
      try{
        cred = await navigator.credentials.create({ publicKey: {
          challenge: randBytes_(32),
          rp: { name: 'Routine Bank' },
          user: { id: randBytes_(16), name: S.familyName + ' ' + me.name, displayName: me.name + '（Routine Bank）' },
          pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
          authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
          attestation: 'none', timeout: 60000 } });
      }catch(e){
        throw new Error(e && e.name === 'NotAllowedError' ? '登録をやめたか、時間切れになりました' : '登録できませんでした：' + errText(e));
      }
      save_(bioKey_(S.me), { credId: b64uEnc_(cred.rawId), pin: pin });
      toast('顔認証をオンにしました', 'ok');
      renderSettings();
    }
  });
}

function bioOff(){
  confirmModal('顔認証をオフにする？', 'このスマホでは、またPINを入れるようになります。', 'オフにする', function(){
    save_(bioKey_(S.me), null);
    renderSettings();
  });
}

/* ── 通知（アプリを閉じていても届くお知らせ）────────────────
   ブラウザの Web Push を使う。この端末の「宛先」をサーバーに登録すると、
   承認待ち・承認の結果・ルーチンの時刻・チャットの返事が届く（中身は Service Worker がサーバーから取ってくる）。
   人ごと・端末ごとの設定（rt_push_家庭名_メンバーID）。Offline版とGASのWebアプリ版では使えない */
const VAPID_PUBLIC_KEY = 'BBYK5L3hZp88usHniF7cqNxWHYweGm6AYpmmi_sw4_8BaKk0qH5bTG3Li55IIpbAKL3AxsXf_0_vdmQ8gGS_sOM';

function pushKey_(){ return 'rt_push_' + S.familyName + '_' + S.me; }
function pushSupported_(){
  return !IS_LOCAL && !!API_URL && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
}
function isIos_(){ return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function isStandalone_(){ return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
function deviceName_(){
  const ua = navigator.userAgent;
  const os = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) || isIos_() ? 'iPad' : /Android/.test(ua) ? 'Android' : /Windows/.test(ua) ? 'Windows' : /Mac/.test(ua) ? 'Mac' : 'その他';
  const br = /Edg\//.test(ua) ? 'Edge' : /Firefox\//.test(ua) ? 'Firefox' : /Chrome\//.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : '';
  return os + (br ? ' ' + br : '');
}

/** この端末の宛先（なければ create のときだけ作る） */
async function pushSubscription_(create){
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub && create) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uDec_(VAPID_PUBLIC_KEY) });
  return sub;
}

/** 通知の許可を聞いて、宛先を作る。だめなら理由つきでエラー */
async function pushAsk_(){
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') throw new Error(perm === 'denied' ? '通知がブロックされています。スマホ（ブラウザ）の設定で、このアプリの通知を許可してください' : '通知の許可をやめました');
  try{ return await pushSubscription_(true); }
  catch(e){ throw new Error('この端末の通知を準備できませんでした：' + errText(e)); }
}

function pushCard_(){
  if (IS_LOCAL || !API_URL) return '';
  const head = '<div class="card"><h2>🔔 通知（この端末）</h2>';
  if (!pushSupported_()){
    return head + '<p class="muted">' + (isIos_() && !isStandalone_()
      ? 'iPhone・iPadでは、Safariの共有ボタン →「ホーム画面に追加」で入れた Routine Bank から開くと、通知を使えます（iOS 16.4以上）。'
      : 'このブラウザでは通知を使えません。Chrome・Edge・Safari の新しい版で開いてください。') + '</p></div>';
  }
  const me = member_(S.me);
  const what = me.role === '親'
    ? '子どもの交換・ルーチンの申請（承認待ち）、ルーチンの時刻（自分用のもの）、チャットの返事'
    : '交換・ルーチンが承認／却下されたとき、ルーチンの時刻、チャットの返事';
  if (Notification.permission === 'denied'){
    return head + '<p class="muted">通知がブロックされています。スマホ（ブラウザ）の設定で、このアプリの通知を許可してから、もう一度開いてください。</p></div>';
  }
  const on = !!load_(pushKey_(), false) && Notification.permission === 'granted';
  return head + toggle_(on, 'this.checked ? pushOn() : pushOff()', '通知を受け取る') +
    '<p class="muted">' + (on ? '' : 'オンにすると、アプリを閉じていても届きます：') + esc(what) +
    '。この端末の' + esc(me.name) + 'だけの設定です。</p>' +
    (on ? '<button class="btn" onclick="pushTestSend()">ためしに送る</button>' : '') + '</div>';
}

/** スマホの設定画面によくある、左右にスライドするスイッチ */
function toggle_(on, onchange, label){
  return '<label class="toggle-row"><span>' + esc(label) + '</span><span class="toggle"><input type="checkbox"' + (on ? ' checked' : '') +
    ' onchange="' + onchange + '"><span class="slider"></span></span></label>';
}

async function pushOn(){
  try{
    const sub = await pushAsk_();
    const res = await gs('pushSubscribe', { token: S.token, memberId: S.me, endpoint: sub.endpoint, threadId: chatThreadId_(), device: deviceName_() });
    save_(pushKey_(), true);
    toast(res.ready ? '通知をオンにしました' : '通知をオンにしました（サーバーの準備ができたら届きます）', 'ok');
    renderSettings();
  }catch(err){ toastErr(err); renderSettings(); }   // うまくいかなかったらスイッチを戻す
}

async function pushTestSend(){
  try{
    const sub = await pushSubscription_(false);
    if (!sub) throw new Error('この端末の通知の登録が消えています。オフにしてから、もう一度オンにしてください');
    await gs('pushTest', { token: S.token, memberId: S.me, endpoint: sub.endpoint });
    toast('送りました。数秒で届きます', 'ok');
  }catch(err){ toastErr(err); }
}

async function pushOff(){
  try{
    const sub = await pushSubscription_(false);
    if (sub) await gs('pushUnsubscribe', { token: S.token, memberId: S.me, endpoint: sub.endpoint });
    save_(pushKey_(), null);
    toast('この端末の' + member_(S.me).name + 'の通知をオフにしました', 'ok');
    renderSettings();
  }catch(err){ toastErr(err); renderSettings(); }
}

/** 起動のたびに、宛先をサーバーに知らせ直す（ブラウザが宛先を作り直すことがあるため）。失敗しても気にしない */
async function pushResync_(){
  if (!pushSupported_() || !load_(pushKey_(), false) || Notification.permission !== 'granted') return;
  try{
    const sub = await pushSubscription_(true);
    await gs('pushSubscribe', { token: S.token, memberId: S.me, endpoint: sub.endpoint, threadId: chatThreadId_(), device: deviceName_() });
  }catch(e){ console.warn('通知の登録し直しに失敗', e); }
}

/** お知らせをタップしたときの行き先（'#view=bank'・'#chat' など） */
function openLink_(hash){
  const m = /^#view=(\w+)$/.exec(hash || '');
  if (m && VIEWS.some(function(v){ return v.key === m[1]; })) switchView(m[1]);
  else if (hash === '#chat') openChat();
  else if (hash === '#notice') openNotices();
}

function pinFailed_(err){
  if (/PIN/.test(errText(err))){ S.parentPin = ''; S.pinFor = ''; }
}

/** 設定の保存（PIN付きでサーバーへ）→ 読み直し。
 *  覚えていたPINが古い（あとでPINを変えた等）ときは、PINを聞き直してもう1回だけ送る */
async function saveSetting_(fn, args){
  const send = function(){ return gs(fn, Object.assign({ token: S.token, actorId: S.me, pin: S.parentPin }, args)); };
  let res;
  try{
    res = await send();
  }catch(err){
    if (!/PINが違います/.test(errText(err)) || !isParent_(S.me)) throw err;
    pinFailed_(err);
    show('modal', false);   // PINを聞く画面と同じ窓を使うので、いったん閉じる
    try{
      if (!(await needPin())) throw new Error('PINの確認をやめました');
      res = await send();
    }catch(err2){ pinFailed_(err2); toastErr(err2); throw err2; }
  }
  toast(res.message, 'ok');
  await refresh();
}

function editRoutine(id){

        return '<option value="' + m.id + '"' + (m.id === r.memberId ? ' selected' : '') + '>' + esc(m.name) + '</option>';

/* ── ルーチンのお知らせ（時刻・曜日）────────
   曜日は '12345' のように番号（0=日〜6=土）。空＝毎日。Offline版は通知がないので出さない */
const DAY_NAMES = ['日', '月', '火', '水', '木', '金', '土'];

function remindEdit_(r){
  if (IS_LOCAL) return '';
  const days = r.remindDays || '0123456';
  return '<label>⏰ お知らせの時刻（空ならお知らせしない）<input type="time" id="rtRemind" value="' + esc(r.remindAt || '') + '"></label>' +
    '<div class="chips" id="rtDays">' + DAY_NAMES.map(function(n, i){
      return '<button type="button" class="chip' + (days.indexOf(String(i)) >= 0 ? ' active' : '') + '" data-day="' + i + '" onclick="this.classList.toggle(\'active\')">' + n + '</button>';
    }).join('') + '</div>' +
    '<p class="muted" style="margin-top:-6px">その時刻に、やる人のスマホに「はじめよう」と届きます（「みんな」用なら子ども全員。今日もうやった人には送りません）。受け取る人は設定の「🔔 通知」をオンにしてね。</p>';
}

/** 画面の入力 → {remindAt, remindDays}。Offline版では今の値のまま */
function remindValue_(r){
  if (IS_LOCAL) return { remindAt: r.remindAt || '', remindDays: r.remindDays || '' };
  const at = val('rtRemind');
  const days = Array.prototype.map.call(document.querySelectorAll('#rtDays .chip.active'), function(b){ return b.dataset.day; }).join('');
  if (at && !days) throw new Error('お知らせする曜日を1つ以上えらんでください');
  return { remindAt: at, remindDays: days.length === 7 ? '' : days };
}

/** '07:00'・'12345' → '⏰ 7:00 平日' */
function remindText_(r){
  if (!r.remindAt) return '';
  const d = r.remindDays || '';
  const days = !d ? '毎日' : d === '12345' ? '平日' : d === '06' ? '土日' : d.split('').map(function(i){ return DAY_NAMES[i]; }).join('・');
  return '⏰ ' + r.remindAt.replace(/^0/, '') + ' ' + days;
}

/** 自分が作ったルーチンはPINなし、ほかの人のものは親PINを聞いてから保存 */
async function saveRoutine_(args){
  if (args.routineId && S.routines.filter(function(x){ return x.id === args.routineId; })[0].createdBy !== S.me){
    if (!(await needPin())) throw new Error('PINの確認をやめました');
  }
  return saveSetting_('saveRoutine', args);
}

               : { id: '', name: '', perMin: 1, unit: '', order: S.rewards.length + 1, active: true };

/* ============================================================

let tourSteps = [];
let tourIdx = 0;
let tourTarget = null;   // 今光らせている要素

function tourKey_(){ return 'rt_tour_' + S.familyName + '_' + S.me; }

/** 光らせる場所。タブはスマホ（下）とPC（上）で場所がちがうので、見えている方を使う */
function tourTab_(key){

function tourEl_(sel){ return function(){ return document.querySelector(sel); }; }

function tourStepsFor_(parent){

function startTour(){
  // ルーチン実行中・チャットを開いているときは出さない（次に開いたときに出る）
  if (['runScreen', 'chatScreen'].some(function(id){ return !document.getElementById(id).classList.contains('hidden'); })) return;
  tourSteps = tourStepsFor_(isParent_(S.me));
  tourIdx = 0;
  show('tour', true);
  window.addEventListener('resize', placeTour_);
  renderTour_();
}

function tourGo(d){
  tourIdx += d;
  if (tourIdx >= tourSteps.length) return endTour();
  renderTour_();
}

function endTour(){
  save_(tourKey_(), true);
  show('tour', false);
  window.removeEventListener('resize', placeTour_);
  if (S.view !== 'timer') switchView('timer');
}

function renderTour_(){
  const st = tourSteps[tourIdx];
  if (st.view && S.view !== st.view) switchView(st.view);
  document.getElementById('tourTitle').textContent = st.title;
  document.getElementById('tourText').textContent = st.text;
  document.getElementById('tourDots').innerHTML = tourSteps.map(function(x, i){ return '<span' + (i === tourIdx ? ' class="on"' : '') + '></span>'; }).join('');
  show('tourBack', tourIdx > 0);
  show('tourSkip', tourIdx < tourSteps.length - 1);
  document.getElementById('tourNext').textContent = tourIdx === tourSteps.length - 1 ? 'はじめる' : '次へ';
  let el = st.el && st.el();
  if (el && st.parentEl) el = el.parentNode;
  if (el && el.getBoundingClientRect().width){
    const r0 = el.getBoundingClientRect();
    if (r0.top < 60 || r0.bottom > window.innerHeight - 90) el.scrollIntoView({ block: 'center' });
  }
  tourTarget = el;
  placeTour_();
}

/** 光らせる穴と説明カードの位置を合わせる。カードは穴とかぶらない側（上か下）に出す */
function placeTour_(){
  const hole = document.getElementById('tourHole');
  const card = document.getElementById('tourCard');
  const el = tourTarget;
  const r = el && el.getBoundingClientRect();
  if (!r || !r.width){
    hole.className = 'tour-hole none';
    card.style.top = Math.max(16, (window.innerHeight - card.offsetHeight) / 2) + 'px';
    return;
  }
  const pad = 6;
  hole.className = 'tour-hole';
  hole.style.left = (r.left - pad) + 'px';
  hole.style.top = (r.top - pad) + 'px';
  hole.style.width = (r.width + pad * 2) + 'px';
  hole.style.height = (r.height + pad * 2) + 'px';
  const below = r.bottom + pad + 12;
  card.style.top = (below + card.offsetHeight <= window.innerHeight - 8
    ? below : Math.max(8, r.top - pad - 12 - card.offsetHeight)) + 'px';
}


/* ============================================================
   7.5 要望チャット（開発者に要望・不具合を送る。返事もここに届く）
   スレッドID＝この端末で作ったランダムな番号。ログインなしで使える。
   Home版はふだんネットを使わないが、チャットだけはGASに送る（FEEDBACK_URL）
   ============================================================ */

const FEEDBACK_URL = '';   // Home版のときだけ build-pwa.js がGASのURLを入れる
const CHAT_WELCOME = 'こんにちは！Routine Bank を作っている開発者です。\n「こうしてほしい」「ここが動かない」など、なんでも送ってね。返事はこの画面に届きます。';
let chatMessages = [];

/** やりとりは「人ごと」。同じ端末でも、ほかの人のメッセージは見えない */
function chatKey_(name){ return 'rt_chat_' + name + '_' + S.familyName + '_' + S.me; }
function chatThreadId_(){
  let id = load_(chatKey_('thread'), '');
  if (!id){ id = uuid_(); save_(chatKey_('thread'), id); }
  return id;
}

function feedbackCall_(fnName, args){
  if (!IS_LOCAL) return gs(fnName, args);
  if (!FEEDBACK_URL) return Promise.reject(new Error('この版ではチャットを使えません'));
  return gsFetch_(fnName, [args], FEEDBACK_URL);
}

async function openChat(){
  show('chatScreen', true);
  renderChat_('読み込み中…');
  try{
    const r = await feedbackCall_('getFeedbackThread', { threadId: chatThreadId_() });
    chatMessages = r.messages;
    renderChat_('');
    markChatSeen_();
  }catch(err){
    renderChat_('⚠️ ' + errText(err));
  }
}

function closeChat(){ show('chatScreen', false); }

async function sendChat(){
  const box = document.getElementById('chatText');
  const text = box.value.trim();
  if (!text) return;
  const btn = document.getElementById('chatSend');
  btn.disabled = true;
  try{
    const me = member_(S.me);
    const r = await feedbackCall_('sendFeedback', {
      threadId: chatThreadId_(), app: IS_LOCAL ? 'home' : 'web',
      familyName: S.familyName, name: me ? me.name : '', message: text
    });
    box.value = '';
    chatMessages = r.messages;
    renderChat_('');
    markChatSeen_();
  }catch(err){
    toastErr(err);
  }finally{
    btn.disabled = false;
  }
}

function renderChat_(note){
  const body = document.getElementById('chatBody');
  body.innerHTML = '<div class="bubble dev"><div class="who">開発者</div>' + esc(CHAT_WELCOME) + '</div>' +
    chatMessages.map(function(m){
      if (m.unsent) return '<div class="bubble unsent">メッセージの送信を取り消しました</div>';
      return '<div class="bubble ' + (m.from === 'dev' ? 'dev' : 'me') + '">' +
        (m.from === 'dev' ? '<div class="who">開発者</div>' : '') + esc(m.text) +
        '<div class="at">' + (m.at ? esc(m.at.slice(5, 16)) : '') +
        (m.from === 'dev' ? '' : ' <button class="unsend" onclick="unsendChat(\'' + esc(m.id) + '\')">取り消す</button>') + '</div></div>';
    }).join('') +
    (note ? '<div class="chat-note">' + esc(note) + '</div>' : '') +
    '<div class="chat-note">送った内容は開発者だけが見ます。名前や住所などは書かないでね。</div>';
  body.scrollTop = body.scrollHeight;
}

function unsendChat(id){
  confirmModal('送信を取り消す？', '開発者からも見えなくなります。', '取り消す', async function(){
    const r = await feedbackCall_('unsendFeedback', { threadId: chatThreadId_(), messageId: id });
    chatMessages = r.messages;
    renderChat_('');
  });
}

function lastDevId_(msgs){
  const dev = msgs.filter(function(m){ return m.from === 'dev'; });
  return dev.length ? dev[dev.length - 1].id : '';
}

function markChatSeen_(){
  save_(chatKey_('seen'), lastDevId_(chatMessages));
  show('chatDot', false);
}

/* ── 開発者のお知らせ（管理者パネルから送られてくる）──────────

async function checkNotices_(){
  try{ await loadNotices_(); }catch(e){ return; }   // 圏外などは気にしない
  const latest = notices[0];

  if (!document.getElementById('modal').classList.contains('hidden') || !document.getElementById('runScreen').classList.contains('hidden')) return;

/** 起動したときに、まだ見ていない返事があれば 💬 に印を付ける */
async function checkChatUnread_(){
  show('chatDot', false);   // 人を切りかえたときに、前の人の印を残さない

      '<label>タイトル<input type="text" id="ntTitle" maxlength="60" placeholder="例：新しい機能を追加しました"></label>' +
      '<label>本文<textarea id="ntBody" rows="5" maxlength="1000" placeholder="くわしい説明（なくてもOK）"></textarea></label></div>' +
      '<div id="ntPushRow">' + toggle_(true, '', '🔔 通知でも送る（Routine Bank で通知をオンにしている人）') + '</div>' +
      '<button class="btn primary block" onclick="devPostNotice()">送る</button></div>' +
    '<div class="card"><h2>送ったお知らせ</h2><div id="ntList"><p class="muted">読み込み中…</p></div></div>';
  try{
    devNoticeList = await devCall_('adminListNotices', {});
    devRenderNoticeList_();
  }catch(err){ document.getElementById('ntList').innerHTML = '<p class="muted">⚠️ ' + esc(errText(err)) + '</p>'; }
}

/** 家事ポイントだけに送るときは通知のしくみがないので、スイッチを出さない */
function devNoticePushRow_(){
  show('ntPushRow', val('ntTarget') !== 'kaji');
}

function devRenderNoticeList_(){
  document.getElementById('ntList').innerHTML = devNoticeList.length ? devNoticeList.map(function(n, i){
    return '<div class="notice-item' + (n.canceled ? ' canceled' : '') + '"><div class="title">' + esc(n.title) +
      (n.canceled ? ' <span class="badge gray">取り消し</span>' : '') + '</div>' +
      '<div class="muted">' + esc(String(n.at).slice(0, 16)) + '・' + esc(n.target) + (n.push ? '・🔔通知あり' : '') + '</div>' +
      (n.body ? '<p>' + esc(n.body) + '</p>' : '') +
      (n.canceled ? '' : '<button class="btn tiny danger" onclick="devCancelNotice(' + i + ')">取り消す</button>') + '</div>';
  }).join('') : '<p class="muted">まだ送っていません</p>';
}

function devPostNotice(){
  const title = val('ntTitle');
  if (!title) return toast('タイトルを入れてください', 'err');
  const target = val('ntTarget');
  const pushBox = document.querySelector('#ntPushRow input');
  const push = target !== 'kaji' && pushBox.checked;
  const where = { all: 'Routine Bank と 家事ポイント のみんな', rb: 'Routine Bank のみんな', kaji: '家事ポイント のみんな' }[target];
  confirmModal('お知らせを送る？', where + 'に「' + title + '」を送ります。' + (push ? '通知もとどきます。' : ''), '送る', async function(){
    const res = await devCall_('adminPostNotice', { target: target, title: title, body: val('ntBody'), push: push });
    toast(res.message, 'ok');
    devNotices_();
  });
}

function devCancelNotice(i){
  const n = devNoticeList[i];
  confirmModal('「' + n.title + '」を取り消す？', 'アプリのお知らせに出なくなります（もう届いた通知は消せません）。', '取り消す', async function(){
    const res = await devCall_('adminCancelNotice', { noticeId: n.id });
    toast(res.message, 'ok');
    devNotices_();
  });
}

async function devOpen(i){
  const t = devThreads[i];
  devThreadId = t.threadId;
  document.getElementById('devTitle').textContent = (t.name || '名前なし') + (t.familyName ? '（' + t.familyName + '）' : '');
  document.getElementById('devBackBtn').textContent = '← 一覧';
  show('devBackBtn', true);
  show('devForm', true);
  document.getElementById('devBody').innerHTML = '<p class="chat-note">読み込み中…</p>';
  try{
    const r = await devCall_('adminGetThread', { threadId: devThreadId });
    devRenderThread_(r.messages);
  }catch(err){ toastErr(err); }
}

/** 開発者から見た画面：相手のメッセージは左、自分（開発者）の返信は右 */
function devRenderThread_(messages){
  const t = devThreads.filter(function(x){ return x.threadId === devThreadId; })[0] || {};
  const body = document.getElementById('devBody');
  devMsgs = messages;
  body.innerHTML = '<p class="chat-note">' + esc(t.app || '') + '</p>' + messages.map(function(m, i){
    const mine = m.from === 'dev';
    if (m.unsent) return '<div class="bubble unsent">' + esc(t.name || '相手') + 'がメッセージを取り消しました' +
      (m.at ? '<div class="at">' + esc(m.at.slice(5, 16)) + '</div>' : '') + '</div>';
    return '<div class="bubble ' + (mine ? 'me' : 'dev') + '">' + (mine ? '' : '<div class="who">' + esc(t.name || '相手') + '</div>') +
      esc(m.text) + (mine ? '' : '<div><button class="btn tiny copy" onclick="devCopy(' + i + ')">📋 コピー</button></div>') +
      (m.at ? '<div class="at">' + esc(m.at.slice(5, 16)) + '</div>' : '') + '</div>';
  }).join('') + (devCanDelete_(messages)
    ? '<p class="chat-note"><button class="btn tiny danger" onclick="devDeleteThread()">🗑 このやりとりを削除</button></p>' : '');
  body.scrollTop = body.scrollHeight;
}

/** 返信済み（取り消し以外で最後が開発者の返信）なら削除できる。サーバーの判定と同じ */
function devCanDelete_(messages){
  const rest = messages.filter(function(m){ return !m.unsent; });
  return !rest.length || rest[rest.length - 1].from === 'dev';
}

function devDeleteThread(){
  const t = devThreads.filter(function(x){ return x.threadId === devThreadId; })[0] || {};
  confirmModal('このやりとりを削除する？', '管理者パネルから消えます（' + (t.name || '相手') + 'のアプリのチャットには残ります）。あとで相手が送ってきたら、新しいメッセージだけがまた出ます。', '削除', async function(){
    await devCall_('adminDeleteThread', { threadId: devThreadId });
    toast('削除しました', 'ok');
    devList_();
  });
}

/** 相手のメッセージをクリップボードへ。古いブラウザ用に、選択してコピーする方法も用意 */
async function devCopy(i){
  const text = devMsgs[i].text;
  try{
    await navigator.clipboard.writeText(text);
  }catch(err){
    const box = document.createElement('textarea');
    box.value = text;
    box.style.position = 'fixed';
    box.style.opacity = '0';
    document.body.appendChild(box);
    box.select();
    const ok = document.execCommand('copy');
    box.remove();
    if (!ok){ toast('コピーできませんでした', 'err'); return; }
  }
  toast('コピーしました', 'ok');
}

async function devSend(){
  const box = document.getElementById('devText');
  const text = box.value.trim();
  if (!text || !devThreadId) return;
  const btn = document.getElementById('devSendBtn');
  btn.disabled = true;
  try{
    const r = await devCall_('adminReply', { threadId: devThreadId, message: text });
    box.value = '';
    devRenderThread_(r.messages);
    toast('返信しました', 'ok');
  }catch(err){ toastErr(err); }
  finally{ btn.disabled = false; }
}

function devBack(){
  if (devThreadId || devNoticeMode) return devList_();
  history.replaceState(null, '', location.pathname + location.search);
  location.reload();
}

function devRefresh(){
  if (devNoticeMode) return devNotices_();
  if (!devThreadId) return devList_();
  const i = devThreads.findIndex(function(t){ return t.threadId === devThreadId; });
  if (i >= 0) devOpen(i);
}


/* ============================================================
   8. 共通の部品
   ============================================================ */

function show(id, visible){
  const el = document.getElementById(id);
  if (el) el.classList.toggle('hidden', !visible);
}
function val(id){
  const el = document.getElementById(id);
  return el ? String(el.value).trim() : '';
}
function toggle(id){ document.getElementById(id).classList.toggle('hidden'); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function isParent_(id){ const m = member_(id); return !!m && m.role === '親'; }
function member_(id){ return S.members.filter(function(m){ return m.id === id; })[0]; }
function activeMembers_(){ return S.members.filter(function(m){ return m.active; }); }
function bal_(id){ return S.balances[id] || { balanceSec: 0, weekSec: 0, monthSec: 0, pendingSec: 0, bankSec: 0 }; }
function sign_(sec){ return sec < 0 ? 'minus' : (sec > 0 ? 'plus' : ''); }

function renderMemberSeg_(elId, current, onPick){
  document.getElementById(elId).innerHTML = activeMembers_().map(function(m){
    return '<button class="' + (m.id === current ? 'active' : '') + '" onclick="' + onPick + '(\'' + m.id + '\')">' + esc(m.name) + '</button>';
  }).join('');
}

/** 1:05 の形（時計表示） */
function fmtClock(sec){
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0');
}
/** 12分30秒 の形 */
function fmtDur(sec){
  const neg = sec < 0;
  sec = Math.abs(Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  const t = (h ? h + '時間' : '') + (m ? m + '分' : '') + (s || (!h && !m) ? s + '秒' : '');
  return (neg ? '−' : '') + t;
}
/** +1分20秒 / −40秒 の形 */
function fmtSigned(sec){ return (sec > 0 ? '+' : '') + fmtDur(sec); }
function fmtNum(n){ return Number(n).toLocaleString('ja-JP', { maximumFractionDigits: 2 }); }

function localDate_(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function uuid_(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2);
}

/**
 * ダイアログ。opts = {title, body, ok, cancel, onOpen, onOk, onCancel}
 * onOk が例外を投げたらダイアログは閉じずにエラーを表示する
 */
function openModal(opts){
  document.getElementById('modalTitle').textContent = opts.title;
  document.getElementById('modalBody').innerHTML = opts.body || '';
  document.getElementById('modalError').textContent = '';
  const okBtn = document.getElementById('modalOk');
  const cancelBtn = document.getElementById('modalCancel');
  okBtn.textContent = opts.ok || 'OK';
  cancelBtn.textContent = opts.cancel || 'やめる';
  cancelBtn.classList.toggle('hidden', opts.cancel === false);   // false なら「やめる」を出さない
  okBtn.disabled = false;
  okBtn.onclick = async function(){
    okBtn.disabled = true;
    try{
      if (opts.onOk) await opts.onOk();
      show('modal', false);
    }catch(err){
      document.getElementById('modalError').textContent = errText(err);
    }finally{
      okBtn.disabled = false;
    }
  };
  cancelBtn.onclick = function(){
    show('modal', false);
    if (opts.onCancel) opts.onCancel();
  };
  show('modal', true);
  if (opts.onOpen) opts.onOpen();
}

function confirmModal(title, text, okLabel, onOk){
  openModal({ title: title, body: '<p>' + esc(text) + '</p>', ok: okLabel, onOk: onOk });
}

function toast(msg, kind){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast' + (kind ? ' ' + kind : '');
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.add('hidden'); }, 3200);
}
function errText(err){ return (err && err.message) || String(err); }
function toastErr(err){ toast(errText(err), 'err'); console.error(err); }

/* ── Enterキーで決定 ──────────────────────────
   ・確認の窓（#modal）が開いているとき：Enter で「OK（確定・保存など）」を押す
   ・ふつうの画面：入力欄で Enter を押すと、同じ行・カードの中のメインのボタン（.primary か data-enter）を押す
   押さないとき：改行したい欄（textarea）・日本語の変換中・ボタンの上（ボタン自身が押される）・
   本物の <form> の中（ブラウザがもともと送信する）・近くにメインのボタンがないとき */
document.addEventListener('keydown', function(e){
  if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229 || e.shiftKey || e.ctrlKey || e.altKey || e.metaKey) return;
  const t = e.target;
  const tag = t && t.tagName;
  if (tag === 'TEXTAREA' || tag === 'BUTTON' || tag === 'A' || (t && t.isContentEditable)) return;
  const textLike = tag === 'INPUT' && !/^(checkbox|radio|file|button|submit|reset|range|color|hidden)$/i.test(t.type);
  const visible = function(el){ return !!el && el.getClientRects().length > 0 && getComputedStyle(el).visibility !== 'hidden'; };
  const usable = function(el){ return visible(el) && !el.disabled; };

  const modal = document.getElementById('modal');
  if (modal && visible(modal) && !modal.classList.contains('hidden')){
    if (modal.contains(t) && !(textLike || tag === 'SELECT')) return;
    const ok = document.getElementById('modalOk');
    if (usable(ok)){ e.preventDefault(); ok.click(); }
    return;
  }

  if (!textLike) return;
  const form = t.form;
  if (form && form.querySelector('button[type="submit"], input[type="submit"]')) return;   // ブラウザにまかせる
  const STOP = '.card, .gate-box, .modal-box, section, [data-enter-scope]';
  for (let el = t.parentElement; el && el !== document.body; el = el.parentElement){
    const btn = Array.prototype.filter.call(el.querySelectorAll('[data-enter], button.primary'), usable)[0];
    if (btn){ e.preventDefault(); btn.click(); return; }
    if (el.matches(STOP)) return;
  }
});
</script>
