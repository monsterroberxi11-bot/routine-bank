/* ============================================================
   8. 共通の部品
   ============================================================ */

function show(id, visible){
  const el = document.getElementById(id);
  if (el) el.classList.toggle('hidden', !visible);
}
function val(id){
  const el = document.getElementById(id);
  return el ? String(el.value).trim() : '';
}
function toggle(id){ document.getElementById(id).classList.toggle('hidden'); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function isParent_(id){ const m = member_(id); return !!m && m.role === '親'; }
function member_(id){ return S.members.filter(function(m){ return m.id === id; })[0]; }
function activeMembers_(){ return S.members.filter(function(m){ return m.active; }); }
function bal_(id){ return S.balances[id] || { balanceSec: 0, weekSec: 0, monthSec: 0, pendingSec: 0 }; }
function sign_(sec){ return sec < 0 ? 'minus' : (sec > 0 ? 'plus' : ''); }

function renderMemberSeg_(elId, current, onPick){
  document.getElementById(elId).innerHTML = activeMembers_().map(function(m){
    return '<button class="' + (m.id === current ? 'active' : '') + '" onclick="' + onPick + '(\'' + m.id + '\')">' + esc(m.name) + '</button>';
  }).join('');
}

/** 1:05 の形（時計表示） */
function fmtClock(sec){
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0');
}
/** 12分30秒 の形 */
function fmtDur(sec){
  const neg = sec < 0;
  sec = Math.abs(Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  const t = (h ? h + '時間' : '') + (m ? m + '分' : '') + (s || (!h && !m) ? s + '秒' : '');
  return (neg ? '−' : '') + t;
}
/** +1分20秒 / −40秒 の形 */
function fmtSigned(sec){ return (sec > 0 ? '+' : '') + fmtDur(sec); }
function fmtNum(n){ return Number(n).toLocaleString('ja-JP', { maximumFractionDigits: 2 }); }

function localDate_(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function uuid_(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2);
}

/**
 * ダイアログ。opts = {title, body, ok, cancel, onOpen, onOk, onCancel}
 * onOk が例外を投げたらダイアログは閉じずにエラーを表示する
 */
function openModal(opts){
  document.getElementById('modalTitle').textContent = opts.title;
  document.getElementById('modalBody').innerHTML = opts.body || '';
  document.getElementById('modalError').textContent = '';
  const okBtn = document.getElementById('modalOk');
  const cancelBtn = document.getElementById('modalCancel');
  okBtn.textContent = opts.ok || 'OK';
  cancelBtn.textContent = opts.cancel || 'やめる';
  okBtn.disabled = false;
  okBtn.onclick = async function(){
    okBtn.disabled = true;
    try{
      if (opts.onOk) await opts.onOk();
      show('modal', false);
    }catch(err){
      document.getElementById('modalError').textContent = errText(err);
    }finally{
      okBtn.disabled = false;
    }
  };
  cancelBtn.onclick = function(){
    show('modal', false);
    if (opts.onCancel) opts.onCancel();
  };
  show('modal', true);
  if (opts.onOpen) opts.onOpen();
}

function confirmModal(title, text, okLabel, onOk){
  openModal({ title: title, body: '<p>' + esc(text) + '</p>', ok: okLabel, onOk: onOk });
}

function toast(msg, kind){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast' + (kind ? ' ' + kind : '');
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.add('hidden'); }, 3200);
}
function errText(err){ return (err && err.message) || String(err); }
function toastErr(err){ toast(errText(err), 'err'); console.error(err); }
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js'); });
}
</script>
